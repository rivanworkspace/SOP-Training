<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="app-version" content="26.10.23-1">
<meta name="robots" content="noindex,nofollow">
<title>SOP Training Indonesia</title>
<style>
:root{--bg:#f3f6f5;--surface:#fff;--ink:#13211e;--muted:#56665f;--line:#d3ddd9;--accent:#0d6b62;--accent-ink:#fff;--bad:#b4232c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1716;--surface:#16211f;--ink:#e3ece9;--muted:#9fb1ab;--line:#2b3b38;--accent:#4fc2b4;--accent-ink:#0b1a18;--bad:#f08a8f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Source Sans 3","Segoe UI",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px 24px;display:flex;flex-direction:column;gap:14px}
.ey{font:700 12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font:800 26px/1.15 "Archivo","Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em}
p{margin:0;color:var(--muted);font-size:15px}
label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:6px}
input[type=password]{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.rm{flex-direction:row;align-items:center;gap:8px;font-weight:400;color:var(--muted)}
button{font:700 15px/1 inherit;font-family:inherit;padding:12px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#err{color:var(--bad);font-size:14px;min-height:1.2em}
.v{font:500 12px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);text-align:center}
</style>
</head>
<body>
<form id="f" autocomplete="on">
 <span class="ey">Indonesia · BD &amp; TW</span>
 <h1>SOP Training</h1>
 <p>Materi ini khusus tim. Masukkan password dari Team Leader.<br>This material is for the team only. Enter the password from your Team Leader.</p>
 <input type="text" name="username" value="sop-training" autocomplete="username" hidden>
 <label for="pw">Password<input id="pw" name="password" type="password" autocomplete="current-password" required></label>
 <label class="rm"><input id="rm" type="checkbox" checked> Ingat di perangkat ini / Remember on this device</label>
 <button id="go" type="submit">Buka / Open</button>
 <div id="err" role="alert"></div>
 <div class="v">v26.10.23-1</div>
</form>
<script>
(function(){
var $=function(i){return document.getElementById(i)},b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
var DATA=null;
function load(){if(DATA)return Promise.resolve(DATA);return fetch("data.json?v=26.10.23-1",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error("net");return r.json()}).then(function(d){DATA=d;return d})}
function derive(pw,d){return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(k){return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(d.salt),iterations:d.iter,hash:"SHA-256"},k,{name:"AES-GCM",length:256},true,["decrypt"])})}
function open(key,d){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(d.iv)},key,b64(d.ct)).then(function(buf){return new TextDecoder().decode(buf)})}
function show(html){document.open();document.write(html);document.close()}
function saved(){try{return localStorage.getItem("sopKey")}catch(e){return null}}
var s=saved();
if(s){load().then(function(d){return crypto.subtle.importKey("raw",b64(s),"AES-GCM",false,["decrypt"]).then(function(k){return open(k,d)})}).then(show).catch(function(){try{localStorage.removeItem("sopKey")}catch(e){}})}
$("f").addEventListener("submit",function(e){e.preventDefault();var pw=$("pw").value;if(!pw)return;$("go").disabled=true;$("err").textContent="";
 load().then(function(d){return derive(pw,d).then(function(k){return open(k,d).then(function(html){
  if($("rm").checked){return crypto.subtle.exportKey("raw",k).then(function(raw){try{localStorage.setItem("sopKey",btoa(String.fromCharCode.apply(null,new Uint8Array(raw))))}catch(e){}return html})}return html})})})
 .then(show).catch(function(x){$("go").disabled=false;$("err").textContent=x&&x.message==="net"?"Gagal memuat materi. Cek koneksi lalu coba lagi. / Couldn't load. Check your connection.":"Password salah. / Wrong password.";$("pw").select()})});
})();
</script>
</body>
</html>
