 {t:["Isi training ini","What this training covers"],b:[`<p>Materi ini menggabungkan empat dokumen SOP menjadi satu panduan untuk tim yang melayani customer Indonesia (BtcDana dan TradeWill). Materi yang muncul di lebih dari satu dokumen sudah digabung menjadi satu bagian, dan bagian SOP All Country hanya diambil yang berlaku untuk Indonesia.</p>

<p>Alat bantu: <b>Studi kasus</b> untuk latihan, <b>Dokumen yang diminta</b> (modul Verifikasi &amp; dokumen), <b>Kode penolakan WD</b> (modul Withdrawal), <b>Template balasan</b> siap salin, dan <b>Glosarium</b> istilah.</p>`,`<p>This material merges four SOP documents into one guide for the team serving Indonesian customers (BtcDana and TradeWill). Topics that appeared in more than one document are merged into a single section, and only the Indonesia parts of SOP All Country are kept.</p>
<ol><li>Open a module from the left menu (on a phone: the menu at the top).</li><li>Click a section title to open it.</li><li>Use the search box to find a topic across all modules, for example "RRN", "1007" or "delete account".</li><li>Mark each module done at its bottom, then take the quiz (10 random questions). When finished, enter your name and copy the result to send to your TL.</li></ol>
<p>Helpers: <b>Case studies</b> for practice, <b>Documents to request</b> (Verification &amp; documents), <b>Withdrawal rejection codes</b> (Withdrawal), copy-ready <b>Reply templates</b>, and a <b>Glossary</b>.</p>`]},
 {t:["Dokumen sumber","Source documents"],b:[`<ul><li><b>SOP All Country</b>, update terakhir 30 Agustus 2026 (bagian Indonesia saja)</li><li><b>10. Customer Documentation, Account Verification &amp; KYC SOP</b></li><li><b>SOP to Solved Problem</b></li><li><b>Frequently Asked Question</b></li></ul><p>Contoh screenshot CRM, PUSH, bukti transfer, KTP, dan dokumen ada di bagian terkait; klik gambar untuk memperbesar. Data pribadi pada contoh sudah disamarkan atau diganti data contoh (misalnya BUDI SANTOSO, 1234567890).</p>`,`<ul><li><b>SOP All Country</b>, last updated 30 August 2026 (Indonesia parts only)</li><li><b>10. Customer Documentation, Account Verification &amp; KYC SOP</b></li><li><b>SOP to Solved Problem</b></li><li><b>Frequently Asked Question</b></li></ul><p>Example CRM and PUSH screenshots, receipts, ID cards and documents appear in the related sections; click an image to enlarge it. Personal data in the examples is blurred or replaced with sample values (for example BUDI SANTOSO, 1234567890).</p>`]},
 {t:["Aturan yang dipakai bila dokumen berbeda","Rules used where documents differ"],b:[`<p>Beberapa dokumen sumber saling berbeda. Untuk tiga hal ini, materi memakai aturan berikut:</p>
<div class="tw"><table><tr><th>Topik</th><th>Yang dipakai</th><th>Sumber</th></tr>
<tr><td>Jadwal withdrawal Indonesia</td><td>±30 menit, 24/7 (bisa lebih lama di luar jam kerja/akhir pekan)</td><td>SOP All Country</td></tr>
<tr><td>Batas saldo saat hapus akun lama</td><td>Saldo &lt; $3: konfirmasi dua kali. Saldo &gt; $3: sarankan transfer saldo.</td><td>SOP All Country</td></tr>
<tr><td>Dokumen ganti nama</td><td>KTP + selfie dengan KTP + 3 bukti deposit terakhir</td><td>SOP to Solved Problem</td></tr></table></div>
<p class="hit">Jadwal SOP to Solved Problem (Senin–Jumat 09.00–18.00) direkomendasikan ke leader untuk diperbarui mengikuti SOP All Country.</p>`,`<p>Some source documents disagree. For these three points, this material uses:</p>
<div class="tw"><table><tr><th>Topic</th><th>Rule used</th><th>Source</th></tr>
<tr><td>Indonesia withdrawal schedule</td><td>About 30 minutes, 24/7 (may be slower outside business hours/weekends)</td><td>SOP All Country</td></tr>
<tr><td>Balance limit when deleting an old account</td><td>Balance &lt; $3: double confirm. Balance &gt; $3: suggest a balance transfer.</td><td>SOP All Country</td></tr>
<tr><td>Name change documents</td><td>ID + selfie with ID + last 3 deposit receipts</td><td>SOP to Solved Problem</td></tr></table></div>
<p class="hit">The SOP to Solved Problem schedule (Mon–Fri 09:00–18:00) is recommended to leaders for updating to match SOP All Country.</p>`]},
 {t:["Pembaruan materi","What's new"],b:[`<ul><li><code>v26.10.23-5</code> Sebutan "nasabah" diganti "customer".</li><li><code>v26.10.23-4</code> Sebutan Trading Consultant; deposit dilaporkan lewat CRM lalu eskalasi ke Lark (bukan PUSH); kutipan kalimat lebih jelas; modul Studi kasus; soal kuis baru.</li><li><code>v26.10.23-3</code> Alat bantu dan kategori PUSH lebih rapi; aturan bila dokumen berbeda; kupon slippage disetujui Team Leader.</li><li><code>v26.10.23-2</code> Dibuka tanpa password di GitHub Pages.</li><li><code>v26.10.23-1</code> Kuis 10 soal acak, template balasan, glosarium, checklist tiket PUSH, contoh gambar tersamar.</li></ul>`,`<ul><li><code>v26.10.23-5</code> The Indonesian text now says "customer" instead of "nasabah".</li><li><code>v26.10.23-4</code> Trading Consultant naming; deposits reported in CRM then escalated in Lark (not PUSH); clearer example lines; Case studies module; new quiz questions.</li><li><code>v26.10.23-3</code> Tidier helpers and PUSH categories; rules where documents differ; slippage coupons approved by the Team Leader.</li><li><code>v26.10.23-2</code> Opens without a password on GitHub Pages.</li><li><code>v26.10.23-1</code> 10 random quiz questions, reply templates, glossary, PUSH ticket checklist, blurred example images.</li></ul>`]}
]},
{k:"push",t:["Eskalasi & PUSH","Escalation & PUSH"],d:["Ke mana melaporkan masalah yang tidak selesai di live chat, dan aturan membuat tiket.","Where to report issues that can't be solved in live chat, and the rules for tickets."],s:[
 {t:["Kategori PUSH untuk customer Indonesia","PUSH categories for Indonesian customers"],b:[`<div class="pgroups"><div class="pg"><div class="pgh"><b>0. Pay Support</b><span>Petugas jaga Payment · PIC Zoya · Leader Yuliany, Brian</span></div><dl class="kv"><dt><code>Withdrawal not credited</code></dt><dd>WD sukses di sistem kita, tapi dana belum masuk ke rekening customer</dd><dt><code>Expedite withdrawal review</code></dt><dd>WD pending yang perlu dipercepat</dd><dt><code>Bank Freeze Issue</code></dt><dd>Rekening bank dibekukan/diblokir</dd><dt><code>WDWT</code></dt><dd>Customer withdraw tanpa trading</dd><dt><code>Other</code></dt><dd>Masalah pembayaran lain</dd></dl></div><div class="pg"><div class="pgh"><b>2. R&amp;D</b><span>Petugas jaga</span></div><dl class="kv"><dt><code>0.dana-Issues-Response</code></dt><dd>Aplikasi DANA: trading (candle tidak bergerak, saldo hilang), jaringan/loading, event (kecuali BDC)</dd><dt><code>1.tw-Issues-Response</code></dt><dd>Aplikasi TW: trading, jaringan/loading, event</dd><dt><code>2.CRM-Issues</code></dt><dd>Masalah pemakaian CRM</dd><dt><code>3.BDC-Issues-Response</code></dt><dd>Masalah/komplain event BDC</dd><dt><code>4.Midware-Issues</code></dt><dd>Harga pasar, pergerakan harga, selisih harga, data chart (OHLC)</dd></dl></div><div class="pg"><div class="pgh"><b>3. Sales</b><span>Trading Consultant customer · PIC Neny</span></div><dl class="kv"><dt><code>0.ID-Sales-Support</code></dt><dd>Masalah customer ID yang tidak selesai di live chat atau perlu follow-up TC</dd><dt><code>4.KOL-BD</code></dt><dd>Masalah referral customer aplikasi DANA</dd></dl></div><div class="pg"><div class="pgh"><b>5. CS</b><span>Account Manager customer · PIC Jm, Nick · ID-Chatroom: Mega · ID-Live Chat: Dicka</span></div><dl class="kv"><dt><code>0.ID-CSTeam-Support</code></dt><dd>Masalah customer ID yang perlu bantuan Account Manager, termasuk perubahan data</dd></dl></div></div>`,`<div class="pgroups"><div class="pg"><div class="pgh"><b>0. Pay Support</b><span>Payment duty officer · PIC Zoya · Leaders Yuliany, Brian</span></div><dl class="kv"><dt><code>Withdrawal not credited</code></dt><dd>WD succeeded on our side but funds haven't reached the customer</dd><dt><code>Expedite withdrawal review</code></dt><dd>Pending WDs that need expediting</dd><dt><code>Bank Freeze Issue</code></dt><dd>Frozen or blocked bank accounts</dd><dt><code>WDWT</code></dt><dd>Customer withdraws without trading</dd><dt><code>Other</code></dt><dd>Other payment issues</dd></dl></div><div class="pg"><div class="pgh"><b>2. R&amp;D</b><span>Duty officer</span></div><dl class="kv"><dt><code>0.dana-Issues-Response</code></dt><dd>DANA app: trading (candles stuck, balance missing), network/loading, events (except BDC)</dd><dt><code>1.tw-Issues-Response</code></dt><dd>TW app: trading, network/loading, events</dd><dt><code>2.CRM-Issues</code></dt><dd>CRM usage issues</dd><dt><code>3.BDC-Issues-Response</code></dt><dd>BDC event issues/complaints</dd><dt><code>4.Midware-Issues</code></dt><dd>Market prices, price moves, price gaps, chart data (OHLC)</dd></dl></div><div class="pg"><div class="pgh"><b>3. Sales</b><span>Customer's Trading Consultant · PIC Neny</span></div><dl class="kv"><dt><code>0.ID-Sales-Support</code></dt><dd>ID customer issues not solved in live chat or needing TC follow-up</dd><dt><code>4.KOL-BD</code></dt><dd>Referral issues for DANA app customers</dd></dl></div><div class="pg"><div class="pgh"><b>5. CS</b><span>Customer's Account Manager · PIC Jm, Nick · ID-Chatroom: Mega · ID-Live Chat: Dicka</span></div><dl class="kv"><dt><code>0.ID-CSTeam-Support</code></dt><dd>ID customer issues needing the Account Manager, including data changes</dd></dl></div></div>`]},
 {f:"push_cek_tiket,push_quick_assign,push_solve,push_close",t:["Aturan melapor","Reporting rules"],b:[`<ol><li><b>Cek dulu sebelum lapor:</b> pastikan belum pernah dilaporkan (tidak duplikat) dan isi detailnya lengkap. Makin banyak konteks, makin baik.</li><li><b>Waktu penyelesaian:</b> umumnya 2–7 hari, tergantung tingkat kesulitan.</li><li><b>Kasus mendesak</b> (misalnya customer mengancam pergi dan berdampak ke bisnis): eskalasi segera, jangan menunggu.</li><li>Kalau masalah sudah selesai, klik <b>SOLVE</b> di PUSH.</li><li>Kalau tiket sudah tuntas, klik <b>CLOSE</b> untuk menutup tiket.</li></ol>`,`<ol><li><b>Check before reporting:</b> make sure it isn't a duplicate and the details are complete. More context is better.</li><li><b>Timeline:</b> most issues are solved within 2–7 days, depending on complexity.</li><li><b>Urgent cases</b> (for example a customer threatening to leave, with business impact): escalate immediately, no waiting.</li><li>When the issue is solved, click <b>SOLVE</b> in PUSH.</li><li>When the ticket is resolved, click <b>CLOSE</b> to close it.</li></ol>`]},
 {t:["Checklist sebelum membuat tiket","Checklist before creating a ticket"],b:[`<ol><li><b>Event Type</b> sesuai grup (lihat tabel kategori). Untuk Pay Support, pilih juga <b>Question Type</b>.</li><li><b>Importance Level:</b> Standard untuk kasus biasa; Important/Urgent hanya bila berdampak besar (misalnya customer mengancam pergi, likuidasi).</li><li><b>Baris pertama Event Description</b> berisi aplikasi, versi, dan SID customer seperti yang tampil di CRM, misalnya <code>TradeWMaster-1.0.13-(V2_N_P_+62_indonesia)20014223278</code>.</li><li>Tulis kronologi singkat: apa masalahnya, nomor order (deposit/WD/trade), waktu, dan nominal.</li><li>Lampirkan bukti di <b>Images</b>, <b>pdf</b>, atau <b>video</b> (bukti transfer, mutasi, rekaman layar). Kalau berupa link, tulis satu link per baris di <b>Image Links</b>.</li><li>Cantumkan <b>nomor WhatsApp</b> customer bila perlu follow up.</li><li>Pakai <b>Quick Assign</b> supaya tiket langsung masuk ke petugas yang tepat, lalu <b>Submit</b>.</li></ol>`,`<ol><li><b>Event Type</b> matching the group (see the category table). For Pay Support, also choose the <b>Question Type</b>.</li><li><b>Importance Level:</b> Standard for normal cases; Important/Urgent only for high impact (for example a customer threatening to leave, liquidation).</li><li><b>The first line of Event Description</b> holds the app, version and customer SID as shown in CRM, for example <code>TradeWMaster-1.0.13-(V2_N_P_+62_indonesia)20014223278</code>.</li><li>Write a short timeline: the problem, order number (deposit/WD/trade), time and amount.</li><li>Attach proof under <b>Images</b>, <b>pdf</b> or <b>video</b> (receipts, statements, screen recordings). For links, put one per line in <b>Image Links</b>.</li><li>Add the customer's <b>WhatsApp number</b> when follow-up is needed.</li><li>Use <b>Quick Assign</b> so the ticket goes straight to the right handler, then <b>Submit</b>.</li></ol>`]}
]},
{k:"comm",t:["Customer & komunikasi","Customers & communication"],d:["Menyambut customer baru dan menjawab situasi percakapan yang sering muncul.","Welcoming new customers and handling common conversation situations."],s:[
 {t:["Menyambut customer baru (pemula)","Welcoming new users (beginners)"],b:[`<ol><li><b>Buka percakapan:</b> <span class="say">"Halo! Apakah sebelumnya pernah mencoba trading?"</span> Ini langsung menunjukkan tingkat pengalamannya.</li><li><b>Beri pengetahuan dasar:</b> jelaskan singkat cara kerja trading, pergerakan pasar, Buy/Sell, profit dan loss, serta manajemen risiko dasar. Buat sederhana, jangan beri terlalu banyak informasi sekaligus.</li><li><b>Kirim tutorial &amp; akun demo:</b> video tutorial pendek, lalu kenalkan akun demo supaya bisa latihan tanpa dana asli.</li><li><b>Ajak ke komunitas:</b> <span class="say">"Silakan gabung grup Telegram kami, banyak trader baru juga di sana!"</span></li><li><b>Tawarkan live streaming</b> (kalau ada): cocok untuk yang suka belajar sambil menonton dan membangun kepercayaan.</li></ol>`,`<ol><li><b>Break the ice:</b> <span class="say">"Hi! Have you ever tried trading before?"</span> This shows their experience level right away.</li><li><b>Share the basics:</b> briefly explain how trading works, market moves, Buy/Sell, profit and loss, and basic risk management. Keep it simple and don't overload them.</li><li><b>Send a tutorial &amp; demo account:</b> a short tutorial video, then introduce the demo account so they can practise without real funds.</li><li><b>Invite to the community:</b> <span class="say">"Feel free to join our Telegram group, lots of new traders are there too!"</span></li><li><b>Offer live streaming</b> (if available): good for visual learners and builds trust.</li></ol>`]},
 {t:["Menjelaskan keunggulan produk","Explaining our product's advantages"],b:[`<p>Kenapa trading di TradeWill / BtcDana?</p><ol><li>Ada Trading Consultant / IB manager yang membantu analisa dan membantu masalah trader.</li><li>Spread rendah.</li><li>Customer Service 24 jam.</li><li>Deposit dan WD sangat cepat, bisa di luar jam kerja.</li><li>Pilihan order beragam.</li></ol>
<h3>Daftar aplikasi per project</h3><div class="tw"><table><tr><th>Project DANA</th><th>Project TW</th></tr><tr><td>BtcDana (iOS)<br>Dana Trading Smart app (Android)<br>ForexDana Trading (Android)<br>Go Dana (Android)<br>BiDana (Android)</td><td>Trade W (iOS)<br>TradeW Broker (Android)<br>TW Broker (Android)<br>Trade Go (iOS)<br>Trade Master (Android)<br>Trade Way (Android)</td></tr></table></div>`,`<p>Why trade with TradeWill / BtcDana?</p><ol><li>An Trading Consultant / IB manager helps with analysis and with traders' problems.</li><li>Low spreads.</li><li>24-hour Customer Service.</li><li>Very fast deposits and WDs, also outside working hours.</li><li>A wide choice of order types.</li></ol>
<h3>Apps per project</h3><div class="tw"><table><tr><th>DANA project</th><th>TW project</th></tr><tr><td>BtcDana (iOS)<br>Dana Trading Smart app (Android)<br>ForexDana Trading (Android)<br>Go Dana (Android)<br>BiDana (Android)</td><td>Trade W (iOS)<br>TradeW Broker (Android)<br>TW Broker (Android)<br>Trade Go (iOS)<br>Trade Master (Android)<br>Trade Way (Android)</td></tr></table></div>`]},
 {t:["Customer rugi karena gangguan aplikasi","Customer lost money due to an app problem"],b:[`<ol><li>Minta maaf atas gangguan yang dialami.</li><li>Tanyakan detail gangguannya.</li><li>Minta bukti kerugian akibat aplikasi (video rekaman, screenshot).</li><li>Cek kebenaran data dari customer.</li><li>Kalau valid, koordinasikan dengan TL/Manager, termasuk kompensasi yang diberikan.</li><li>Laporkan ke PUSH.</li></ol>`,`<ol><li>Apologise for the disruption.</li><li>Ask for the details of the problem.</li><li>Ask for proof of the loss caused by the app (video recording, screenshot).</li><li>Check whether the data is correct.</li><li>If valid, coordinate with your TL/Manager, including any compensation.</li><li>Report it in PUSH.</li></ol>`]},
 {t:["Customer rugi dan menyalahkan kita","Customer lost money and blames us"],b:[`<ol><li>Tenangkan customer.</li><li>Tanyakan kendalanya dengan sopan.</li><li>Sampaikan dengan sopan bahwa kendala tersebut bukan kesalahan aplikasi.</li><li>Tawarkan bantuan Trading Consultant untuk belajar trading dan analisa pair yang diinginkan. Boleh arahkan ke TikTok atau YouTube kita sebagai referensi belajar.</li><li>Edukasi bahwa trading bukan judi atau tebak-tebakan, tapi berdasarkan analisa dan pengaruh ekonomi/geopolitik global.</li></ol>`,`<ol><li>Calm the customer down.</li><li>Politely ask what the problem is.</li><li>Politely explain that the problem was not caused by the app.</li><li>Offer the Trading Consultant's help with learning to trade and analysing the pairs they want. You may point them to our TikTok or YouTube for learning.</li><li>Explain that trading is not gambling or guessing; it is based on analysis and global economic/geopolitical factors.</li></ol>`]},
 {t:["Customer mencaci tanpa alasan","Customer is abusive for no reason"],b:[`<ol><li>Gali alasan sikap customer (kalau masih tersambung di telepon atau masih membalas WA).</li><li>Tenangkan customer dan beri edukasi sesuai yang ia keluhkan.</li></ol>`,`<ol><li>Find out the reason behind the behaviour (if still on the call or still replying on WhatsApp).</li><li>Calm the customer and give education that fits what they said.</li></ol>`]},
 {t:["Customer minta nomor HP pribadi","Customer asks for your personal number"],b:[`<p>Berikan nomor HP yang disediakan kantor, bukan nomor pribadi.</p>`,`<p>Give the phone number provided by the office, not your personal number.</p>`]},
 {t:["Customer minta dibantu instruksi trading","Customer wants trading instructions"],b:[`<ol><li>Sampaikan bahwa membantu analisa pasar adalah tugas Trading Consultant, dan customer sebaiknya memanfaatkan kelebihan ini.</li><li>Selain analisa, Trading Consultant juga mengajarkan cara menganalisa sendiri.</li><li>Sampaikan bahwa analisa Trading Consultant tidak 100% pasti; customer berhak memakai analisa lain.</li></ol>`,`<ol><li>Explain that market analysis is the Trading Consultant's job and the customer should make use of it.</li><li>Besides analysis, the Trading Consultant also teaches how to analyse on their own.</li><li>Make clear the Trading Consultant's analysis is not 100% certain; the customer may use other analysis.</li></ol>`]},
 {t:["Customer minta ganti Trading Consultant","Customer wants a different Trading Consultant"],b:[`<ol><li>Minta maaf dan sampaikan bahwa hal tersebut tidak memungkinkan.</li><li>Sampaikan bahwa setiap Trading Consultant punya kelebihan dan keunikan sendiri.</li><li>Sampaikan bahwa kamu akan membantu sebaik mungkin.</li></ol>`,`<ol><li>Apologise and explain that this isn't possible.</li><li>Explain that every Trading Consultant has their own strengths.</li><li>Say that you will help them as best you can.</li></ol>`]},
 {t:["Customer minta uang tanpa trading","Customer asks how to earn without trading"],b:[`<ol><li>Kenalkan event referral untuk mendapat komisi (referral &amp; IB); komisinya bisa dipakai trading.</li><li>Kenalkan Saving Account.</li></ol>`,`<ol><li>Introduce the referral event to earn commission (referral &amp; IB); the commission can be used for trading.</li><li>Introduce the Saving Account.</li></ol>`]}
]},
{k:"dep",t:["Deposit","Deposit"],d:["Bukti yang dibutuhkan, lapor lewat CRM, dan eskalasi ke Lark untuk kasus mendesak. Deposit tidak lewat PUSH.","Required proof, reporting in CRM, and escalating urgent cases in Lark. Deposits don't go through PUSH."],s:[
 {t:["Alur normal","Normal flow"],b:[`<p>Deposit biasanya diproses otomatis, tapi kadang ada jeda sekitar ±30 menit. Untuk kurs yang berlaku, cek di aplikasi; kurs bisa berubah mengikuti kebijakan vendor pihak ketiga.</p>`,`<p>Deposits usually process automatically, but there can be a delay of about 30 minutes. For the current exchange rate, check the app; rates may change with third-party vendor policies.</p>`]},
 {tag:"hot",f:"bca_ref,bca_transfer,bca_mtransfer,livin,dana_trx,dana_qris,brimo_qris,shopeepay,ovo",t:["Deposit belum masuk","Deposit not credited"],b:[`<ol><li>Minta maaf atas gangguannya.</li><li>Minta bukti transfer yang menunjukkan transaksi berhasil, plus nomor order deposit dari aplikasi.</li><li>Cek di CRM.</li><li>Laporkan lewat <b>CRM</b> dengan ikon Report (langkahnya di bawah). Deposit <b>tidak</b> dilaporkan lewat PUSH.</li><li>Kalau mendesak, statusnya berubah URGENT, atau customer tidak membuat order, eskalasi ke grup Lark <b>Deposit Prioritized Handling</b>.</li><li>Ucapkan terima kasih atas datanya, sampaikan bahwa kendala segera diproses, dan kabari customer setelah selesai.</li></ol>
<h3>Isi bukti transfer yang wajib terlihat</h3><ul><li>Status: "Transaksi Berhasil"</li><li>Bank / e-wallet yang dipakai</li><li>Waktu deposit (tanggal dan jam)</li><li>Jumlah deposit</li><li>Nama pengirim dan nama penerima/merchant</li><li><b>Indonesia: No. Ref wajib untuk transfer bank, RRN wajib untuk QRIS</b></li></ul>
<h3>Kalau bukti transfer belum cukup</h3><p>Minta mutasi rekening/e-wallet yang mencakup 3–7 hari dari tanggal pembayaran. Bukti yang diterima: PDF e-statement, video mutasi, atau keduanya.</p>
<div class="note warn"><b>Bukti ditolak</b>Bukti yang tidak lengkap, terpotong, diedit, atau buram boleh ditolak. Minta bukti yang utuh dan jelas sebelum pembayaran bisa diverifikasi.</div>`,`<ol><li>Apologise for the disruption.</li><li>Ask for the receipt showing a successful transaction, plus the deposit order number from the app.</li><li>Check in CRM.</li><li>Report through <b>CRM</b> with the Report icon (steps below). Deposits are <b>not</b> reported through PUSH.</li><li>If it is urgent, the status changes to URGENT, or the customer made no order, escalate in the Lark group <b>Deposit Prioritized Handling</b>.</li><li>Thank them for the data, say the issue is being processed, and update the customer once it's done.</li></ol>
<h3>What the receipt must show</h3><ul><li>Status: "Transaction Successful"</li><li>Bank / e-wallet used</li><li>Deposit date and time</li><li>Deposit amount</li><li>Sender name and receiver/merchant name</li><li><b>Indonesia: Ref No. is mandatory for bank transfers, RRN is mandatory for QRIS</b></li></ul>
<h3>If the receipt isn't enough</h3><p>Ask for a bank/e-wallet statement covering 3–7 days from the payment date. Accepted: PDF e-statement, a video of the transaction history, or both.</p>
<div class="note warn"><b>Rejected proof</b>Incomplete, cropped, edited or blurry receipts may be rejected. Ask for a complete, clear receipt before the payment can be verified.</div>`]},
 {t:["Penyebab umum deposit bermasalah","Common causes of deposit issues"],b:[`<ul><li>Koneksi internet tidak stabil: minta customer refresh dan coba lagi.</li><li>Nomor Virtual Account (VA) salah atau kedaluwarsa.</li><li>Channel pembayaran sedang maintenance.</li></ul>
<h3>Salah nomor VA</h3><ol><li>Konfirmasi nomor VA yang benar dengan customer.</li><li>Kalau VA yang dipakai salah, pandu customer membuat VA baru atau hubungi support.</li><li>Laporkan ke tim Payment bila perlu tindakan lanjut.</li></ol>`,`<ul><li>Unstable internet: ask the customer to refresh and try again.</li><li>Wrong or expired Virtual Account (VA) number.</li><li>Payment channel under maintenance.</li></ul>
<h3>Wrong VA number</h3><ol><li>Confirm the correct VA number with the customer.</li><li>If the VA used was wrong, guide them to generate a new VA or contact support.</li><li>Report to the Payment team if further action is needed.</li></ol>`]},
 {f:"crm_deposit_order,crm_report_type,crm_report_form",t:["Lapor deposit lewat CRM","Report a deposit in CRM"],b:[`<ol><li>Salin SID, tempel di <b>Client List</b>.</li><li>Buka halaman <b>Deposit Order</b>. Pilih waktu sesuai bukti transfer, sedikit sebelum order dibuat. Contoh: bukti jam 15.15, pilih 15.10.</li><li>Klik ikon <b>Report</b>.</li><li>Unggah bukti transfer (copy-paste foto atau lewat link).</li><li>Tambahkan Remarks bila ada catatan.</li></ol>
<div class="note warn"><b>Checkbox</b>Centang checkbox hanya untuk kasus MENDESAK (misalnya likuidasi atau proses prioritas).</div>`,`<ol><li>Copy the SID and paste it into <b>Client List</b>.</li><li>Open <b>Deposit Order</b>. Pick the time from the receipt, just before the order was made. Example: receipt at 15:15, choose 15:10.</li><li>Click the <b>Report</b> icon.</li><li>Upload the receipt (copy-paste the photo or by link).</li><li>Add Remarks if needed.</li></ol>
<div class="note warn"><b>Checkbox</b>Tick the checkbox ONLY for URGENT cases (for example liquidation or priority processing).</div>`]},
 {tag:"hot",f:"lark_deposit_group",t:["Deposit mendesak (grup Lark)","Urgent deposits (Lark group)"],b:[`<p>Laporkan segera di grup Lark <b>"Deposit Prioritized Handling"</b> bila status tiba-tiba berubah menjadi URGENT, atau customer tidak membuat order deposit di aplikasi.</p>
<div class="note"><b>Deskripsi</b>Tulis dari sudut pandang customer, bukan tafsiran CS, supaya Payment bisa menilai tingkat urgensinya dengan tepat.</div>
<h3>Format laporan</h3><div class="tpl"><pre>[To follow up] &lt;nomor order deposit&gt; — &lt;deskripsi singkat&gt;</pre></div>
<p>Contoh:</p><div class="tpl"><pre>[To follow up] ICZ1020250902311xxx — customer received margin call notification.</pre></div>
<h3>Deposit crypto tanpa order</h3><div class="tpl"><pre>[To follow up] Customer deposited crypto without creating a deposit order
TX/Hash ID: &lt;isi&gt;
Address: &lt;isi&gt;
Screenshot payment proof: &lt;lampiran&gt;</pre></div>
<h3>Setelah selesai</h3><p>Ganti [To follow up] menjadi [COMPLETED]:</p><div class="tpl"><pre>[COMPLETED] ICZ1020250902311xxx — customer received margin call notification.</pre></div>`,`<p>Report immediately in the Lark group <b>"Deposit Prioritized Handling"</b> when the status suddenly changes to URGENT, or the customer did not create a deposit order in the app.</p>
<div class="note"><b>Description</b>Write it from the customer's point of view, not the CS interpretation, so Payment can judge urgency correctly.</div>
<h3>Report format</h3><div class="tpl"><pre>[To follow up] &lt;deposit order number&gt; — &lt;brief description&gt;</pre></div>
<p>Example:</p><div class="tpl"><pre>[To follow up] ICZ1020250902311xxx — customer received margin call notification.</pre></div>
<h3>Crypto deposit without an order</h3><div class="tpl"><pre>[To follow up] Customer deposited crypto without creating a deposit order
TX/Hash ID: &lt;insert&gt;
Address: &lt;insert&gt;
Screenshot payment proof: &lt;attachment&gt;</pre></div>
<h3>When resolved</h3><p>Change [To follow up] to [COMPLETED]:</p><div class="tpl"><pre>[COMPLETED] ICZ1020250902311xxx — customer received margin call notification.</pre></div>`]},
 {f:"panin_statement,kk",t:["Kasus deposit khusus","Special deposit cases"],b:[`<div class="tw"><table><tr><th>Situasi</th><th>Minta ke customer</th></tr>
<tr><td>Pembayaran gagal tapi saldo terpotong</td><td>Bukti transfer + ID transaksi/No. Ref + mutasi + e-statement. Surat atau email bank yang menyatakan pembayaran berhasil dan dana tidak akan dikembalikan.</td></tr>
<tr><td>Pembayaran pihak ketiga</td><td>Bukti transfer + data pembayar (KTP/paspor + selfie) + bukti hubungan atau kuasa bila perlu (misalnya akta lahir, atau foto keduanya memegang KTP masing-masing).</td></tr>
<tr><td>Pembayaran ganda</td><td>Kedua bukti transfer + mutasi yang menunjukkan kedua transaksi.</td></tr>
<tr><td>Pembayaran POS/tunai</td><td>Mutasi bank/kartu + struk POS (bila ada) + bukti pembuatan order di aplikasi. Tim Payment mencocokkan data pengirim dengan order di sistem.</td></tr></table></div>
<h3>Customer tanya kenapa tujuan deposit memakai nama pribadi</h3><ol><li>Minta maaf atas ketidaknyamanannya.</li><li>Jelaskan bahwa deposit via Virtual Account masih maintenance.</li><li>Jelaskan bahwa selama deposit diajukan lewat menu deposit di aplikasi, semuanya aman dan valid. Jangan deposit di luar aplikasi.</li></ol>`,`<div class="tw"><table><tr><th>Situation</th><th>Ask the customer for</th></tr>
<tr><td>Payment failed but customer was charged</td><td>Receipt + transaction ID/Ref No. + statement + e-statement. A bank letter or email confirming the payment succeeded and will not be reversed.</td></tr>
<tr><td>Third-party payment</td><td>Receipt + payer details (ID/passport + selfie) + proof of relationship or authorisation if needed (for example a birth certificate, or a photo of both holding their IDs).</td></tr>
<tr><td>Duplicate payment</td><td>Both receipts + a statement showing both transactions.</td></tr>
<tr><td>POS/cash payment</td><td>Bank/card statement + POS receipt (if any) + proof the order was created in our app. Payment matches the sender details with the order in our system.</td></tr></table></div>
<h3>Customer asks why the deposit goes to a personal name</h3><ol><li>Apologise for the inconvenience.</li><li>Explain that Virtual Account deposits are under maintenance.</li><li>Explain that as long as the deposit is made through the app's deposit menu, it is safe and valid. Never deposit outside the app.</li></ol>`]}
]},
{k:"wd",t:["Withdrawal","Withdrawal"],d:["Waktu proses, arti status, kode penolakan 1001–1012, WD belum diterima, dan WDTT.","Processing times, statuses, rejection codes 1001–1012, WD not received, and WDTT."],tool:"codes",s:[
 {t:["Waktu proses (Indonesia)","Processing time (Indonesia)"],b:[`<p>Withdrawal biasanya diproses sekitar 30 menit dan tersedia 24/7. Bisa lebih lama di luar jam kerja atau akhir pekan, sesuai kebijakan withdrawal. Minimum withdrawal $10.</p>`,`<p>Withdrawals usually take about 30 minutes and are available 24/7. They may be slower outside business hours or at weekends, as stated in the withdrawal policy. The minimum withdrawal is $10.</p>`]},
 {t:["Arti status withdrawal","Withdrawal statuses"],b:[`<div class="tw"><table><tr><th>Status</th><th>Artinya</th><th>Yang dilakukan</th></tr>
<tr><td>Bank Processing</td><td>Payment sudah memproses, menunggu bank mengirim dana ke rekening/e-wallet customer</td><td>Minta customer menunggu. Lebih dari 24 jam: lapor ke tim Payment.</td></tr>
<tr><td>Automatic Review</td><td>Masih ditinjau sistem (CRM)</td><td>Lebih dari 30 menit: lapor ke tim Payment.</td></tr>
<tr><td>Manual Pending</td><td>Payment belum mulai memproses</td><td>Boleh lapor untuk follow up, tapi sampaikan dulu ke customer bahwa WD biasanya diproses dalam 30 menit.</td></tr></table></div>
<div class="note"><b>Catatan</b>Customer VIP4 boleh dilaporkan ke Payment supaya prosesnya dipercepat. Jangan pernah menjanjikan apa pun ke customer; minta dengan sopan untuk menunggu sampai proses selesai.</div>`,`<div class="tw"><table><tr><th>Status</th><th>Meaning</th><th>What to do</th></tr>
<tr><td>Bank Processing</td><td>Payment has processed it; waiting for the bank to send funds to the customer's account/e-wallet</td><td>Ask the customer to wait. Over 24 hours: report to Payment.</td></tr>
<tr><td>Automatic Review</td><td>Still under system (CRM) review</td><td>Over 30 minutes: report to Payment.</td></tr>
<tr><td>Manual Pending</td><td>Payment has not started processing</td><td>You may report it for follow-up, but first tell the customer that WDs are usually processed within 30 minutes.</td></tr></table></div>
<div class="note"><b>Notes</b>VIP4 customers may be reported to Payment to expedite. Never make promises to customers; politely ask them to wait until the process is complete.</div>`]},
 {tag:"hot",f:"push_wd_not_received",t:["WD sukses tapi dana belum diterima","WD successful but funds not received"],b:[`<p>Kalau status CRM <b>"Successful"</b> tapi dana belum diterima:</p><ol><li>Cek di CRM bahwa WD memang sukses.</li><li>Minta rekaman layar riwayat transaksi bank dari tanggal WD sampai hari ini, plus ID transaksi WD. Nomor rekening harus terlihat di rekaman.</li><li>Alternatif: file PDF, asalkan jelas memuat nama customer, nomor rekening, dan tanggal WD.</li><li>Buat tiket PUSH: <b>0. Pay Support → Withdrawal not credited</b>.</li></ol>`,`<p>If CRM shows <b>"Successful"</b> but the funds haven't arrived:</p><ol><li>Check in CRM that the WD really succeeded.</li><li>Ask for a screen recording of the bank transaction history from the WD date to today, plus the WD transaction ID. The account number must be visible.</li><li>Alternatively a PDF, as long as it clearly shows the customer's name, account number and WD date.</li><li>Create a PUSH ticket: <b>0. Pay Support → Withdrawal not credited</b>.</li></ol>`]},
 {tag:"hot",f:"push_wdtt",t:["WDTT / WDWT: withdraw tanpa trading","WDTT / WDWT: withdrawal without trading"],b:[`<p>Customer bisa ditandai WDTT bila:</p><ul><li>Deposit dan withdraw tanpa aktivitas trading.</li><li>Deposit besar tapi trading sangat sedikit (misalnya hanya 0,01 lot).</li><li>Pernah WD sukses, lalu tiba-tiba deposit lagi dan langsung withdraw tanpa aktivitas.</li><li>Status CRM: "Withdrawal failed, please contact us via LiveChat" atau dipicu anti-money laundering.</li></ul>
<div class="note bad"><b>Jangan</b>Jangan bilang ke customer bahwa ia "kena WDTT", jangan langsung bertanya "Kenapa tidak trading?", dan jangan mengajari cara menghindari WDTT.</div>
<h3>Ajukan pertanyaan terbuka dan netral</h3><p class="say">"Boleh diceritakan alasan Bapak/Ibu melakukan deposit?"</p><p class="say">"Kami melihat ada deposit rutin tanpa aktivitas di aplikasi. Ada yang bisa kami bantu?"</p><p class="say">"Kami melihat Bapak/Ibu deposit lalu langsung withdraw. Apakah ada kendala atau pertanyaan?"</p><p class="say">"Boleh dibantu jelaskan pertimbangan Bapak/Ibu memilih deposit di aplikasi kami?"</p>
<p>Kalau customer bertanya "Kenapa tidak bisa withdraw padahal sudah trading?":</p><p class="say">"Ini bukan soal eksekusi trading. Akun Bapak/Ibu menunjukkan pola deposit yang tidak biasa. Boleh dijelaskan alasan deposit yang sering atau besar?"</p>
<h3>Data yang dikumpulkan</h3><ul><li>Bukti transfer deposit terbaru (1–5 bukti). Nama pengirim harus terlihat; kalau tidak, minta PDF mutasi yang menunjukkan nama pemilik rekening.</li><li>Foto KTP.</li><li>Nomor WhatsApp atau email.</li></ul><p>Pastikan metode withdrawal sama dengan metode deposit. Tanpa bukti kepemilikan pembayaran yang cukup, WD bisa tidak diproses. Buat tiket PUSH, atau balas di thread kalau di-tag di grup Payment × Sales.</p>`,`<p>A customer may be flagged WDTT when:</p><ul><li>Deposits and withdrawals happen with no trading activity.</li><li>Deposits are high but trading is minimal (for example only 0.01 lots).</li><li>They withdrew successfully before, then suddenly deposit again and withdraw right away with no activity.</li><li>CRM status: "Withdrawal failed, please contact us via LiveChat" or triggered by anti-money laundering.</li></ul>
<div class="note bad"><b>Don't</b>Don't tell the customer they "got WDTT", don't ask directly "Why didn't you trade?", and don't coach them on how to bypass WDTT.</div>
<h3>Ask open, neutral questions</h3><p class="say">"Could you share the reason you decided to make a deposit?"</p><p class="say">"We noticed regular deposits without activity in the app. Is there anything we can help with?"</p><p class="say">"We saw you deposited and withdrew right away. Is there any issue you'd like to clarify?"</p><p class="say">"Could you help us understand why you chose to deposit in our app?"</p>
<p>If they ask "Why can't I withdraw even though I traded?":</p><p class="say">"This is not about trade execution. Your account shows unusual deposit behaviour. Could you explain the reason for frequent or large deposits?"</p>
<h3>Data to collect</h3><ul><li>Latest 1–5 deposit receipts. The sender name must show; if not, ask for a PDF statement showing the account holder's name.</li><li>ID card photo.</li><li>WhatsApp number or email.</li></ul><p>Make sure the withdrawal method matches the deposit method. Without enough proof of payment ownership, the WD may not be processed. Create a PUSH ticket, or reply in the thread if tagged in the Payment × Sales group.</p>`]}
]},
{k:"kyc",t:["Verifikasi & dokumen","Verification & documents"],d:["Kapan meminta dokumen, kenapa verifikasi gagal, syarat foto KTP dan bukti alamat.","When to request documents, why verification fails, ID photo and address proof rules."],tool:"docs",s:[
 {t:["Tujuan meminta dokumen","Why we request documents"],b:[`<ul><li>Memastikan identitas dan kepemilikan akun.</li><li>Menyelesaikan atau memperbarui KYC.</li><li>Memastikan kepemilikan pembayaran dan transaksi.</li><li>Mencegah penipuan, transaksi tanpa izin, dan penyalahgunaan akun.</li><li>Memastikan kepemilikan rekening bank/e-wallet.</li><li>Memenuhi syarat penyedia pembayaran, bank, dan compliance.</li><li>Menyelidiki transaksi mencurigakan atau yang disengketakan.</li></ul>`,`<ul><li>Verify identity and account ownership.</li><li>Complete or update KYC.</li><li>Verify payment and transaction ownership.</li><li>Prevent fraud, unauthorised transactions and account abuse.</li><li>Verify bank account or wallet ownership.</li><li>Meet payment provider, bank and compliance requirements.</li><li>Investigate suspicious or disputed transactions.</li></ul>`]},
 {tag:"hot",f:"app_kyc_error,crm_kyc_failed",t:["Verifikasi gagal: penyebab dan penanganan","Verification failed: causes and handling"],b:[`<h3>Penyebab umum</h3><ul><li><b>Akun ganda:</b> email, nomor HP, KTP, atau data bank sudah pernah dipakai.</li><li><b>Data bank/e-wallet salah:</b> nomor tidak valid atau e-wallet belum terverifikasi (misalnya DANA belum premium).</li><li><b>Nama tidak cocok:</b> nama di aplikasi/MT5 ≠ KTP ≠ rekening.</li><li><b>Format KTP salah:</b> nomor tidak sesuai format negara.</li><li><b>Foto bermasalah:</b> buram, diedit, screenshot, atau hasil scan.</li><li><b>Terlalu banyak unggahan:</b> foto buram berulang dalam waktu singkat, foto KTP depan berkali-kali tanpa sisi belakang, atau jenis ID yang berbeda-beda.</li></ul>
<h3>Penanganan</h3><ol><li>Ingatkan bahwa nama harus sama dengan KTP dan rekening.</li><li>Cek apakah data sudah dipakai di akun lain.</li><li>Kalau customer punya akun lain, tanyakan alasan membuat akun baru (lihat modul Akun).</li><li>Kalau ada data atau saldo yang perlu dipindah, buat tiket PUSH.</li><li>Kalau semua terlihat benar tapi KYC tetap gagal, hubungi Team Leader.</li></ol>`,`<h3>Common causes</h3><ul><li><b>Duplicate account:</b> email, phone, ID card or bank details used before.</li><li><b>Wrong bank/e-wallet info:</b> invalid number or unverified e-wallet (for example DANA not premium).</li><li><b>Name mismatch:</b> name in app/MT5 ≠ ID ≠ bank account.</li><li><b>Wrong ID format:</b> number doesn't match the country format.</li><li><b>Photo problems:</b> blurry, edited, a screenshot or a scan.</li><li><b>Too many uploads:</b> repeated blurry photos in a short time, the ID front many times without the back, or different ID types.</li></ul>
<h3>Handling</h3><ol><li>Remind them the name must match the ID and bank account.</li><li>Check whether the data is already used on another account.</li><li>If they have another account, ask why they made a new one (see the Account module).</li><li>If data or balance needs moving, create a PUSH ticket.</li><li>If everything looks right but KYC still fails, contact your Team Leader.</li></ol>`]},
 {f:"ktp_example,ktp_front,ktp_back,selfie_ktp,paspor_example",t:["Syarat foto KTP","ID photo requirements"],b:[`<p>Foto yang diminta hanya KTP sisi <b>depan dan belakang</b>. Yang harus jelas terlihat:</p><ol><li>Nama lengkap</li><li>Nomor KTP (NIK)</li><li>Tanggal lahir</li><li>Foto diri di KTP</li></ol><p>Semua informasi harus jelas dan mudah dibaca: tidak buram, tidak diedit, bukan screenshot, tidak tertutup, dan tidak silau.</p>
<div class="note"><b>Indonesia: KTP rusak</b>Kalau foto KTP rusak dan sistem MT5 tidak bisa membacanya, customer boleh mengirim paspor, SIM, atau ID lain sebagai bukti tambahan. Syaratnya, foto KTP depan dan belakang sudah diunggah di halaman verifikasi.</div>`,`<p>Only the <b>front and back</b> of the ID card are needed. These must be clearly visible:</p><ol><li>Full name</li><li>ID number (NIK)</li><li>Date of birth</li><li>Photo on the ID</li></ol><p>Everything must be clear and readable: no blur, no edits, no screenshots, nothing covering it, no glare.</p>
<div class="note"><b>Indonesia: damaged KTP</b>If the KTP photo is damaged and MT5 can't read it, the customer may send a passport, driver's licence or other ID as extra proof. The front and back of the KTP must already be uploaded on the verification page.</div>`]},
 {f:"web_kyc_incomplete",t:["KYC MT5: pertanyaan customer","KYC (MT5): customer questions"],b:[`<p>Kalau status verifikasi di aplikasi dan website <b>"Incomplete"</b>, artinya customer sudah mulai verifikasi di website tapi belum selesai dengan benar.</p>
<div class="tw"><table><tr><th>Pertanyaan</th><th>Jawaban</th></tr>
<tr><td>Dulu sudah disetujui, kenapa sekarang FAILED?</td><td>Kalau tidak sengaja memulai verifikasi di website KYC dan tidak menyelesaikannya, status bisa berubah dari "approved" ke "failed". Pastikan proses KYC selalu diselesaikan.</td></tr>
<tr><td>Boleh lewati KYC karena repot?</td><td>Belum bisa. Verifikasi aplikasi dan website saling terhubung dan wajib diselesaikan. Tim IT masih mengerjakan pemisahan kedua proses ini.</td></tr></table></div>
<h3>Kalau customer menolak melanjutkan KYC</h3><ol><li>Tetap profesional dan tenang, jangan berdebat atau memaksa.</li><li>Sampaikan dengan sopan bahwa keluhannya akan dieskalasi.</li><li>Laporkan kasusnya ke Team Leader dengan detail.</li><li>Team Leader menghubungi IT untuk alternatif (CC: Davy &amp; Tom untuk BtcDana, Davy &amp; Scott untuk TradeW).</li></ol>`,`<p>If the app and website verification status shows <b>"Incomplete"</b>, the customer started verification on the website but didn't finish it correctly.</p>
<div class="tw"><table><tr><th>Question</th><th>Answer</th></tr>
<tr><td>It was approved before. Why FAILED now?</td><td>If verification was accidentally started on the KYC website and not finished, the status may change from "approved" to "failed". Always complete the KYC process.</td></tr>
<tr><td>Can I skip KYC?</td><td>Not at the moment. App and website verification are linked and must be completed. IT is still working on separating them.</td></tr></table></div>
<h3>If the customer refuses to continue KYC</h3><ol><li>Stay professional and calm; don't argue or insist.</li><li>Politely say their concern will be escalated.</li><li>Report the case to your Team Leader with details.</li><li>The Team Leader contacts IT for alternatives (CC: Davy &amp; Tom for BtcDana, Davy &amp; Scott for TradeW).</li></ol>`]},
 {f:"crm_address,bni_mutasi,bri_mutasi,bri_tagihan,stockbit,surat_domisili",t:["Verifikasi alamat","Address verification"],b:[`<p>Dokumen bukti alamat harus memenuhi semua syarat ini:</p><ol><li>Menampilkan nama lengkap sesuai identitas.</li><li>Menampilkan alamat tempat tinggal lengkap.</li><li>Tanggal dokumen/terbit dalam 3 bulan terakhir.</li><li>Diterbitkan resmi, dicetak atau digital.</li><li>Bukan tulisan tangan.</li><li>Jelas, terbaca, dan sesuai data KYC.</li></ol>
<div class="tw"><table><tr><th>Jenis dokumen</th><th>Syarat</th></tr>
<tr><td>Tagihan utilitas (listrik, air, gas, internet, telepon rumah)</td><td>Nama dan alamat lengkap. Tidak diedit, bukan scan atau screenshot, tidak buram, maksimal 3 bulan.</td></tr>
<tr><td>Rekening koran / mutasi bank</td><td>Nama, alamat, dan tanggal dokumen. Maksimal 3 bulan, jelas, asli.</td></tr>
<tr><td>Surat keterangan domisili</td><td>Dari pihak setempat (RT/RW, kantor desa/kelurahan). Jelas, tidak diedit, maksimal 3 bulan.</td></tr>
<tr><td>Tagihan kartu kredit</td><td>Nama lengkap dan alamat lengkap. Bukan screenshot, tidak buram.</td></tr>
<tr><td>Surat resmi lembaga keuangan</td><td>Perjanjian pinjaman atau surat resmi bank. Asli, terbaca, maksimal 3 bulan.</td></tr></table></div>`,`<p>Proof-of-address documents must meet all of these:</p><ol><li>Show the full legal name.</li><li>Show the complete home address.</li><li>Dated or issued within the last 3 months.</li><li>Officially issued, printed or digital.</li><li>Not handwritten.</li><li>Clear, readable and consistent with the KYC data.</li></ol>
<div class="tw"><table><tr><th>Document</th><th>Requirements</th></tr>
<tr><td>Utility bill (electricity, water, gas, internet, landline)</td><td>Full name and address. Not edited, scanned or a screenshot, not blurry, issued within 3 months.</td></tr>
<tr><td>Bank statement</td><td>Name, address and document date. Within 3 months, clear, original.</td></tr>
<tr><td>Certificate of residence</td><td>From local authorities (RT/RW, village office). Clear, unedited, within 3 months.</td></tr>
<tr><td>Credit card bill</td><td>Full name and complete address. No screenshots or blurry images.</td></tr>
<tr><td>Official letter from a financial institution</td><td>Loan agreement or formal bank letter. Original, readable, within 3 months.</td></tr></table></div>`]}
]},
{k:"acct",t:["Akun & perubahan data","Accounts & data changes"],d:["Akun ganda, transfer saldo, hapus akun, ganti email/HP, nama, rekening, dan kode referral.","Double accounts, balance transfer, account deletion, email/phone, name and bank changes, referral codes."],s:[
 {t:["Mengenali SID","Reading the SID"],b:[`<p>SID BtcDana diawali <code>100…</code>, SID TradeWill diawali <code>200…</code>. Saat memeriksa customer BtcDana di CRM → Identity Verification, akun terverifikasinya juga harus ber-SID <code>10…</code>.</p>
<div class="note bad"><b>Jangan</b>Jangan pernah menyebut atau mengisyaratkan bahwa BtcDana dan TradeW adalah aplikasi yang sama, termasuk saat ada kesalahan pengecekan.</div>`,`<p>BtcDana SIDs start with <code>100…</code>, TradeWill SIDs with <code>200…</code>. When checking a BtcDana customer in CRM → Identity Verification, the verified account must also have a SID starting with <code>10…</code>.</p>
<div class="note bad"><b>Don't</b>Never say or imply that BtcDana and TradeW are the same app, including after a checking error.</div>`]},
 {tag:"hot",f:"crm_find_account",t:["Akun ganda terdeteksi","Double account detected"],b:[`<ol><li>Minta email akun untuk dicek, lalu cek data customer untuk menemukan akun ganda.</li><li>Tanyakan alasan membuat akun baru.</li><li>Cek versi aplikasi yang dipakai customer di CRM.</li><li>Tawarkan pilihan: login ke akun pertama, hapus akun pertama, atau pindahkan saldo.</li><li>Kalau ada data atau saldo yang perlu dipindah, buat tiket PUSH.</li></ol>
<h3>Ingin pakai akun lama</h3><ul><li>Lupa password: bantu reset password.</li><li>Email tidak aktif atau lupa: sarankan update email.</li></ul>
<h3>Ingin pakai akun baru</h3><ul><li><b>Akun lama VIP0/VIP1:</b> boleh dihapus. Selalu sampaikan bahwa sisa saldo akan hangus. Saldo &lt; $3: konfirmasi dua kali; saldo &gt; $3: sarankan transfer saldo.</li><li><b>Akun lama VIP2+ dan akun baru sudah deposit:</b> cek login terakhir. Kalau tidak aktif lebih dari 6 bulan, jelaskan bahwa VIP2+ punya keuntungan lebih baik. Kalau tetap memilih akun lama, pandu login dan ajukan transfer saldo dari akun baru ke akun lama.</li><li>Kalau customer tetap ingin menghapus akun lama, bantu ajukan penghapusan setelah semua data lengkap.</li></ul>`,`<ol><li>Ask for the account email, then check customer data to find the duplicate.</li><li>Ask why they created a new account.</li><li>Check which app version they use in CRM.</li><li>Offer options: log in to the first account, delete the first account, or move the balance.</li><li>If data or balance needs moving, create a PUSH ticket.</li></ol>
<h3>Wants the old account</h3><ul><li>Forgot password: help reset it.</li><li>Email inactive or forgotten: suggest updating it.</li></ul>
<h3>Wants the new account</h3><ul><li><b>Old account VIP0/VIP1:</b> can be deleted. Always tell them any remaining balance will be forfeited. Balance &lt; $3: double confirm; balance &gt; $3: suggest a balance transfer.</li><li><b>Old account VIP2+ and the new account has deposits:</b> check the last login. If inactive for over 6 months, explain VIP2+ has better benefits. If they still prefer the old account, guide them to log in and request a balance transfer from new to old.</li><li>If they insist on deleting the old account, help submit the request once all data is provided.</li></ul>`]},
 {f:"push_balance_transfer",t:["Transfer saldo (akun ganda)","Balance transfer (double account)"],b:[`<ol><li>Tanyakan alasan customer membuat akun ganda. Sampaikan juga bahwa sayang kalau pindah akun karena keuntungan VIP di akun lama.</li><li>Transfer saldo hanya dari akun <b>belum terverifikasi</b> ke akun <b>terverifikasi</b>, dengan identitas yang sama.</li><li>Minimum transfer <b>$5</b>.</li><li>Akun lama harus bisa login dan minimal VIP1.</li></ol>
<p>Bisa login, VIP0, tanpa saldo: sarankan hapus akun. Tidak bisa login dan tanpa saldo: sarankan hapus akun.</p>
<h3>Dokumen (dikirim dari akun BARU)</h3><ul><li>Foto KTP</li><li>Bukti deposit berhasil dari akun baru (sesuai FAQ: 3 bukti deposit terakhir)</li><li>Email</li></ul>
<div class="note warn"><b>Proses 2×24 jam</b>Di luar akhir pekan. Selama proses, customer tidak boleh deposit atau trading. Kalau ada aktivitas, permintaan otomatis dibatalkan.</div>`,`<ol><li>Ask why the customer made a second account. Mention it's a pity to move away from the VIP benefits on the old account.</li><li>Balance transfer is only from an <b>unverified</b> account to a <b>verified</b> account with the same identity.</li><li>Minimum transfer <b>$5</b>.</li><li>The old account must be accessible (can log in) and at least VIP1.</li></ol>
<p>Can log in, VIP0, no balance: suggest deleting it. Can't log in and no balance: suggest deleting it.</p>
<h3>Documents (sent from the NEW account)</h3><ul><li>ID card photo</li><li>Proof of a successful deposit from the new account (FAQ: the last 3 deposit receipts)</li><li>Email</li></ul>
<div class="note warn"><b>Takes 2×24 hours</b>Excluding weekends. During this time the customer must not deposit or trade. Any activity cancels the request automatically.</div>`]},
 {tag:"hot",f:"crm_vip_balance,crm_delete_user,crm_logout_reason,crm_deleted_rm,crm_deleted_watermark,crm_delete_request",t:["Hapus akun","Delete an account"],b:[`<p>Tanyakan alasannya dan coba bujuk untuk membatalkan. Customer juga bisa menghapus akun sendiri di aplikasi.</p>
<h3>Dokumen</h3><ul><li>KTP (atau paspor, SIM)</li><li>Data rekening bank: nama pemilik harus sama dengan nama di KTP</li><li>Email, 3 bukti deposit terakhir, dan alasan menghapus akun</li></ul>
<div class="tw"><table><tr><th>VIP0, tanpa saldo &amp; aktivitas</th><th>VIP0/VIP1 dengan saldo</th><th>VIP2/VIP3/VIP4</th></tr><tr>
<td>Bisa diproses cepat, tidak perlu menunggu 2×24 jam. Minta bantuan Team Leader.</td>
<td>Selalu konfirmasi: "Sisa saldo akan hangus setelah akun dihapus."<br>Saldo &lt; $3: konfirmasi dua kali.<br>Saldo &gt; $3: sarankan transfer saldo (akun baru minimal $5).<br>Kalau customer bilang "hapus saja saldonya", catat dengan jelas supaya petugas berikutnya tidak perlu konfirmasi ulang. Saldo &gt; $3 tanpa konfirmasi bisa ditolak ID-CS.</td>
<td>Selalu tanyakan kenapa ingin menghapus atau membuat akun baru.<br>Karena tidak puas: minta Account Manager/Sales follow up dan cek pengalamannya.<br>Karena akun ganda (tidak tahu hanya boleh 1 akun per KTP, tidak sadar TW &amp; WT atau BD &amp; FD aplikasi yang sama, lupa email tapi masih bisa login): sarankan transfer saldo kalau akun baru punya minimal $5.</td></tr></table></div>
<h3>Langkah di CRM</h3><ol><li>Cari lewat <b>Client List</b> dengan email atau nomor HP, lalu klik SID yang cocok. Pastikan SID benar: BtcDana <code>100…</code>, TradeW <code>200…</code>.</li><li>Cek level VIP dan sisa saldo; konfirmasi ulang kalau VIP tinggi dan masih ada saldo.</li><li>Klik <b>User Logout</b>, hanya setelah dipastikan akun tidak akan dipakai lagi.</li><li>Isi alasan penghapusan dengan catatan: (1) saldo: tidak ada sisa saldo, atau customer setuju sisa saldo $0.0 hangus; (2) alasan, misalnya "Duplicate account – customer already has another SID 100** and has deposited".</li><li>Lampirkan KTP dan dokumen lain sebagai gambar (klik, drag-and-drop, atau Ctrl+V). Jangan menaruh link di kolom alasan.</li><li>Klik <b>Submit</b>.</li></ol>
<h3>Cek status penghapusan</h3><ul><li>CRM → Identity Verification, masukkan SID. Akun terhapus: email berakhiran "-RM" dan status Review Failed, atau ada watermark "Delete Account" saat SID diklik.</li><li>Waktu pengajuan: CRM → Customer Request → Delete User, masukkan SID, klik "x" di kolom waktu, lihat "Application Time".</li></ul>
<div class="note"><b>Hak akses</b>Hanya Sales atau Account Manager yang boleh mengubah data; yang lain hanya melihat.</div>`,`<p>Ask why and try to persuade them to cancel. Customers can also delete the account themselves in the app.</p>
<h3>Documents</h3><ul><li>ID card (or passport, driver's licence)</li><li>Bank account details: the holder's name must match the ID</li><li>Email, last 3 deposit receipts, and the reason for deleting</li></ul>
<div class="tw"><table><tr><th>VIP0, no balance &amp; activity</th><th>VIP0/VIP1 with balance</th><th>VIP2/VIP3/VIP4</th></tr><tr>
<td>Can be processed quickly, no need to wait 2×24 hours. Ask your Team Leader for help.</td>
<td>Always confirm: "Any remaining balance will be forfeited once the account is deleted."<br>Balance &lt; $3: double confirm.<br>Balance &gt; $3: suggest a balance transfer (new account needs at least $5).<br>If the customer says "just delete the balance", write it down clearly so the next person doesn't need to reconfirm. Balance &gt; $3 without confirmation may be rejected by ID-CS.</td>
<td>Always ask why they want to delete or made a new account.<br>Dissatisfied: ask the Account Manager/Sales to follow up and check their experience.<br>Duplicate accounts (didn't know only 1 account per ID is allowed, didn't realise TW &amp; WT or BD &amp; FD are the same app, forgot the email but can still log in): suggest a balance transfer if the new account has at least $5.</td></tr></table></div>
<h3>Steps in CRM</h3><ol><li>Search <b>Client List</b> by email or phone, then click the matching SID. Make sure it's the right SID: BtcDana <code>100…</code>, TradeW <code>200…</code>.</li><li>Check the VIP level and remaining balance; reconfirm if VIP is high and there's a balance.</li><li>Click <b>User Logout</b>, only after confirming the account won't be used again.</li><li>Fill in the reason with notes: (1) balance: no remaining balance, or the customer agreed to forfeit $0.0; (2) reason, for example "Duplicate account – customer already has another SID 100** and has deposited".</li><li>Attach the ID and other documents as images (click, drag-and-drop or Ctrl+V). Don't put links in the reason field.</li><li>Click <b>Submit</b>.</li></ol>
<h3>Check the deletion status</h3><ul><li>CRM → Identity Verification, enter the SID. Deleted: the email ends in "-RM" and status is Review Failed, or a "Delete Account" watermark shows when you click the SID.</li><li>Request time: CRM → Customer Request → Delete User, enter the SID, click "x" on the time field, check "Application Time".</li></ul>
<div class="note"><b>Access</b>Only Sales or Account Managers may make changes; everyone else only views.</div>`]},
 {f:"crm_user_list,push_ganti_email",t:["Ganti email atau nomor HP (manual)","Manual email or phone change"],b:[`<p>Semua perubahan data diajukan lewat PUSH. Ganti manual hanya boleh kalau customer tidak bisa menerima kode OTP lewat email atau HP. Data yang dibutuhkan:</p><ol><li>SID customer</li><li>Alasan ganti email/HP (tanyakan dulu sebelum meminta isi form)</li><li>Email/HP lama</li><li>Email/HP baru. Cek di CRM → User List bahwa belum terdaftar di aplikasi, dan pastikan bisa menerima OTP.</li><li>Foto KTP</li><li>Bukti deposit (minimal 3). Kalau tidak ada, boleh selfie memegang KTP.</li><li>Nomor WhatsApp/HP aktif</li></ol>
<div class="note"><b>Catatan</b>Kalau customer sudah mengajukan lebih dari dua kali, minta penjelasan lebih detail dan tambahkan remarks untuk petugas. Permintaan bisa ditugaskan ke Regina, Chen, Emilia, atau Dicka. Cek ulang semua data sebelum membuat tiket PUSH.</div>`,`<p>All data changes go through PUSH. A manual change is only allowed when the customer can't receive OTP codes by email or phone. Required:</p><ol><li>Customer SID</li><li>Reason for the change (ask this first, before asking them to fill in the form)</li><li>Old email/phone</li><li>New email/phone. Check CRM → User List that it isn't registered in the app, and confirm it can receive OTP.</li><li>ID card photo</li><li>Proof of deposit (at least 3). If unavailable, a selfie holding the ID card.</li><li>Active WhatsApp/phone number</li></ol>
<div class="note"><b>Notes</b>If the customer has requested a change more than twice, ask for a more detailed explanation and add remarks for the handler. Requests can be assigned to Regina, Chen, Emilia or Dicka. Double-check everything before creating the PUSH ticket.</div>`]},
 {t:["Ganti nama","Name change"],b:[`<ol><li>Minta foto KTP, selfie dengan KTP, dan 3 bukti deposit terakhir.</li><li>Buat tiket PUSH dan tugaskan ke <b>ID CS Team Support</b>.</li></ol>`,`<ol><li>Ask for an ID photo, a selfie with the ID, and the last 3 deposit receipts.</li><li>Create a PUSH ticket assigned to <b>ID CS Team Support</b>.</li></ol>`]},
 {f:"mybca,dana_profile",t:["Ganti rekening bank / e-wallet","Change bank account / e-wallet"],b:[`<div class="tw"><table><tr><th>Perubahan</th><th>Cara</th></tr>
<tr><td>Bank → bank</td><td rowspan="3">Customer ganti sendiri: Akun → Pengaturan → Verifikasi Identitas → Ubah rekening bank</td></tr><tr><td>E-wallet → bank</td></tr><tr><td>E-wallet → e-wallet</td></tr>
<tr><td>Bank → e-wallet</td><td>Hubungi Trading Consultant/CS untuk unbind, lalu verifikasi ulang</td></tr></table></div>
<h3>Bila diminta bukti</h3><ul><li>Foto KTP, 3 bukti deposit terakhir, dan alasan ganti rekening.</li><li>Bukti kepemilikan rekening: mutasi atau dokumen resmi bank. Video kepemilikan rekening lebih disarankan; video harus memuat nama pemilik, dan cek kecocokannya di CRM. Sama untuk e-wallet.</li></ul>
<p>Rekening baru diganti dalam 24 jam bisa memicu kode WD 1006 (lihat alat kode WD).</p>`,`<div class="tw"><table><tr><th>Change</th><th>How</th></tr>
<tr><td>Bank → bank</td><td rowspan="3">Customer changes it: Account → Settings → Identity Verification → Change bank</td></tr><tr><td>E-wallet → bank</td></tr><tr><td>E-wallet → e-wallet</td></tr>
<tr><td>Bank → e-wallet</td><td>Contact the Trading Consultant/CS to unbind, then re-verify</td></tr></table></div>
<h3>When proof is needed</h3><ul><li>ID photo, last 3 deposit receipts, and the reason for the change.</li><li>Proof of account ownership: a statement or official bank document. A video of account ownership is preferred; it must show the holder's name, and check it against CRM. Same for e-wallets.</li></ul>
<p>An account changed within 24 hours can trigger WD code 1006 (see the WD code tool).</p>`]},
 {t:["Tambah kode referral setelah daftar","Add a referral code after registration"],b:[`<ol><li>Pastikan akun baru (kurang dari 15 hari).</li><li>Pastikan belum ada deposit di akun tersebut.</li><li>Minta email/SID dan laporkan ke Pedro/Neny untuk rebind.</li></ol>`,`<ol><li>Make sure the account is new (under 15 days).</li><li>Make sure there is no deposit on it.</li><li>Ask for the email/SID and report to Pedro/Neny to rebind.</li></ol>`]},
 {tag:"hot",f:"crm_nbp_deposit,crm_nbp_trade",t:["Potongan deposit NBP: lapor","NBP deposit deduction: reporting"],b:[`<p>Kasus NBP terjadi saat saldo customer minus lalu terpotong oleh deposit berikutnya. Kasus ini harus segera dilaporkan dan diselesaikan dalam 24 jam. <b>Tidak perlu tiket PUSH dan tidak perlu screenshot saldo akun customer.</b></p>
<h3>Langkah</h3><ol><li>Cek di CRM: nomor, waktu, dan jumlah deposit (Deposit Order), serta nomor, waktu, dan nilai NBP.</li><li>Tulis detail NBP dengan format di bawah.</li><li>Lampirkan 3 foto dari CRM: <b>deposit order</b>, <b>close order</b> (Live Order → Close), dan <b>liquidation order</b> (Others → Liquidation Order).</li></ol>
<h3>Format detail NBP</h3><div class="tpl"><pre>This customer was in a negative -$&lt;nilai NBP&gt; and deposited $&lt;jumlah deposit&gt; which reduce his balance. Here are the details.

SID: &lt;SID customer&gt;
Deposit No. &lt;nomor order deposit&gt; | &lt;tanggal jam&gt; | $&lt;jumlah deposit&gt;
NBP No. &lt;nomor NBP&gt; | &lt;tanggal jam&gt; | -$&lt;nilai NBP&gt;
If possible can you help recover $&lt;jumlah deposit&gt; to the cust balance?</pre></div>
<h3>Contoh</h3><div class="tpl"><pre>This customer was in a negative -$8.74 and deposited $6 which reduce his balance. Here are the details.

SID: 20009635378
Deposit No. TCZ2020260916428266 | 17-09-2026 01:11 | $6
NBP No. HCZ20260917849072 | 17-09-2026 01:17 | -$8.74
If possible can you help recover $6 to the cust balance?</pre></div>
<div class="note"><b>Lampiran wajib</b>Foto deposit order, foto close order, dan foto liquidation order.</div>`,`<p>An NBP case happens when a customer's balance is negative and the next deposit is deducted to cover it. It must be reported right away and resolved within 24 hours. <b>No PUSH ticket and no account balance screenshot are needed.</b></p>
<h3>Steps</h3><ol><li>Check in CRM: the deposit number, time and amount (Deposit Order), and the NBP number, time and amount.</li><li>Write the NBP details in the format below.</li><li>Attach 3 photos from CRM: <b>deposit order</b>, <b>close order</b> (Live Order → Close) and <b>liquidation order</b> (Others → Liquidation Order).</li></ol>
<h3>NBP detail format</h3><div class="tpl"><pre>This customer was in a negative -$&lt;NBP amount&gt; and deposited $&lt;deposit amount&gt; which reduce his balance. Here are the details.

SID: &lt;customer SID&gt;
Deposit No. &lt;deposit order number&gt; | &lt;date time&gt; | $&lt;deposit amount&gt;
NBP No. &lt;NBP number&gt; | &lt;date time&gt; | -$&lt;NBP amount&gt;
If possible can you help recover $&lt;deposit amount&gt; to the cust balance?</pre></div>
<h3>Example</h3><div class="tpl"><pre>This customer was in a negative -$8.74 and deposited $6 which reduce his balance. Here are the details.

SID: 20009635378
Deposit No. TCZ2020260916428266 | 17-09-2026 01:11 | $6
NBP No. HCZ20260917849072 | 17-09-2026 01:17 | -$8.74
If possible can you help recover $6 to the cust balance?</pre></div>
<div class="note"><b>Required attachments</b>Deposit order photo, close order photo and liquidation order photo.</div>`]}
]},
{k:"trade",t:["Trading & aplikasi","Trading & app"],d:["Menjelaskan istilah trading, biaya, dan menangani bug aplikasi.","Explaining trading terms and fees, and handling app bugs."],s:[
 {t:["Stop Out","Stop Out"],b:[`<p>Stop Out terjadi saat margin level (modal) customer turun di bawah 10%, sehingga posisi ditutup otomatis.</p><ol><li>Jelaskan apa itu Stop Out.</li><li>Beri saran: kurangi membuka banyak posisi sekaligus; jaga margin level di atas 100% (kalau ingin menahan posisi, deposit untuk menambah equity, bukan untuk membuka posisi baru); pasang Take Profit/Stop Loss.</li><li>Kalau SO disebabkan bug atau berita yang memengaruhi posisi, tawarkan kupon sebesar (harga SL − harga close).</li></ol>`,`<p>Stop Out happens when the customer's margin level falls below 10%, so positions are closed automatically.</p><ol><li>Explain what Stop Out is.</li><li>Advise: avoid opening many positions at once; keep the margin level above 100% (to hold a position, deposit to raise equity, not to open new positions); set Take Profit/Stop Loss.</li><li>If a bug or news caused the SO, offer a coupon worth (SL price − close price).</li></ol>`]},
 {t:["Take Profit / Stop Loss","Take Profit / Stop Loss"],b:[`<ol><li>Jelaskan apa itu TP dan SL.</li><li>Jarak minimum 50 pips (−0,50 &amp; +0,50).</li><li>Jelaskan pentingnya TP dan SL untuk mengelola risiko.</li></ol>`,`<ol><li>Explain what TP and SL are.</li><li>The minimum distance is 50 pips (−0.50 &amp; +0.50).</li><li>Explain why TP and SL matter for risk management.</li></ol>`]},
 {t:["Slippage","Slippage"],b:[`<ol><li>Minta maaf atas ketidaknyamanannya, lalu cek waktu penutupan posisi.</li><li>Jelaskan: slippage adalah selisih antara harga yang diharapkan dan harga yang benar-benar tereksekusi.</li><li>Penyebabnya volatilitas tinggi: saat pasar bergerak cepat, harga bisa berubah drastis dalam sekejap, sehingga order tereksekusi di harga baru.</li><li>Edukasi cara menghindari: pakai limit order, atau trading saat volatilitas tidak tinggi.</li><li>Kalau customer masih kecewa, pertimbangkan kupon setelah persetujuan Team Leader.</li></ol>
<div class="note"><b>Contoh</b>BUY 1 lot XAUUSD di 2550.00, TP 2555.00, SL 2545.00. Harga turun cepat ke 2540, SL tereksekusi di 2543.00, bukan 2545.00.</div>`,`<ol><li>Apologise, then check the position's closing time.</li><li>Explain: slippage is the gap between the expected price and the price actually executed.</li><li>It's caused by high volatility: when the market moves fast, prices can jump in an instant, so the order fills at a new price.</li><li>Teach how to avoid it: use limit orders, or trade when volatility isn't high.</li><li>If the customer is still upset, consider a coupon after your Team Leader's approval.</li></ol>
<div class="note"><b>Example</b>BUY 1 lot XAUUSD at 2550.00, TP 2555.00, SL 2545.00. Price drops fast to 2540; the SL fills at 2543.00, not 2545.00.</div>`]},
 {t:["Spread melebar & harga berbeda","Wide spreads & price differences"],b:[`<p>Spread adalah selisih harga bid (jual) dan ask (beli). Contoh: harga beli 1000, harga jual 1005, spread = 5. Ada spread floating dan fixed; kita memakai spread floating.</p>
<h3>Spread melebar di pagi hari</h3><ol><li>Minta maaf atas ketidaknyamanannya.</li><li>Jelaskan bahwa di pagi hari, terutama saat pergantian sesi (US ke Asia), likuiditas rendah: pelaku pasar lebih sedikit, sehingga spread melebar.</li><li>Edukasi: pakai limit order, atau trading saat pasar aktif.</li></ol>
<h3>Harga posisi berbeda dengan chart</h3><ol><li>Jelaskan ada dua harga: Bid dan Ask.</li><li>Spread floating membuat posisi Sell ditutup mendekati harga Buy, dan sebaliknya.</li></ol>`,`<p>Spread is the gap between the bid (sell) and ask (buy) price. Example: buy 1000, sell 1005, spread = 5. Spreads can be floating or fixed; we use floating spreads.</p>
<h3>Wide spreads in the morning</h3><ol><li>Apologise for the inconvenience.</li><li>Explain that in the morning, especially at session changes (US to Asia), liquidity is low: fewer participants, so spreads widen.</li><li>Teach: use limit orders, or trade when the market is active.</li></ol>
<h3>Position price differs from the chart</h3><ol><li>Explain there are two prices: Bid and Ask.</li><li>Floating spreads mean a Sell closes near the Buy price, and the reverse.</li></ol>`]},
 {t:["Profit tidak masuk saldo","Profit not added to balance"],b:[`<ol><li>Jelaskan transaksi real-time dan dampaknya ke saldo.</li><li>Cek riwayat transaksi dan catatan sistem.</li><li>Cek apakah ada saldo negatif.</li><li>Cek posisi terbuka yang memengaruhi saldo.</li><li>Tinjau semua transaksi: deposit, withdrawal, biaya admin, swap, profit/loss, dan kupon.</li></ol>
<h3>Kupon tidak masuk</h3><ol><li>Cek di CRM apakah task sudah selesai.</li><li>Buat tiket PUSH dan konsultasikan dengan Ms. Neny.</li></ol>`,`<ol><li>Explain real-time transactions and how they affect the balance.</li><li>Check transaction history and system records.</li><li>Check for a negative balance.</li><li>Check open positions that affect the balance.</li><li>Review all transactions: deposits, withdrawals, admin fees, swaps, profit/loss and coupons.</li></ol>
<h3>Coupon not added</h3><ol><li>Check in CRM whether the task is done.</li><li>Create a PUSH ticket and consult Ms. Neny.</li></ol>`]},
 {t:["Biaya: komisi, swap, deposit/WD","Fees: commission, swap, deposit/WD"],b:[`<h3>Komisi terlalu tinggi</h3><p>Pahami keluhannya, jelaskan alasan dan manfaat biaya komisi. Kalau customer bilang broker lain tanpa komisi, jelaskan bahwa spread mereka biasanya jauh lebih lebar.</p>
<h3>Swap terlalu tinggi</h3><ol><li>Sarankan trading di siang hari (intraday) untuk menghindari swap.</li><li>Customer dengan reputasi baik bisa ditawari akun bebas swap.</li><li>Dorong naik ke VIP4: bebas swap dan diskon komisi 20% (BtcDana) atau 10% (TradeWill).</li></ol>
<h3>Biaya deposit dan WD berbeda</h3><p>Biaya WD menanggung biaya transaksi dan pemrosesan, seperti biaya jaringan. Minimum WD hanya $10 dan prosesnya cepat, tidak lebih dari 30 menit.</p>`,`<h3>Commission too high</h3><p>Understand the concern and explain the reasons and benefits behind the fee. If they say another broker charges no commission, explain that its spreads are usually much wider.</p>
<h3>Swap too high</h3><ol><li>Suggest intraday trading to avoid swaps.</li><li>Customers with a good record can be offered a swap-free account.</li><li>Encourage VIP4: swap-free and a 20% (BtcDana) or 10% (TradeWill) commission discount.</li></ol>
<h3>Why deposit and WD fees differ</h3><p>WD fees cover transaction and processing costs such as network fees. The minimum WD is only $10 and it's fast, no more than 30 minutes.</p>`]},
 {t:["Grafik dimanipulasi, indikator, demo vs real","Chart manipulation, indicators, demo vs real"],b:[`<h3>Tuduhan manipulasi grafik / scam</h3><ol><li>Tanyakan masalah grafiknya.</li><li>Minta bukti screenshot/rekaman.</li><li>Ingatkan untuk membandingkan grafik di MT4 dan TradingView.</li><li>Kalau terbukti bug, buat tiket PUSH ke tim IT (grup Midware untuk masalah harga).</li></ol>
<h3>Indikator tidak akurat</h3><p>Jelaskan bahwa indikator bisa memberi sinyal palsu, terutama saat pasar volatil, karena berbasis data masa lalu. Beri edukasi singkat.</p>
<h3>Akun real vs demo</h3><p>Akun real memakai uang asli dengan profit dan loss nyata; akun demo memakai uang virtual untuk latihan tanpa risiko.</p>`,`<h3>Chart manipulation / scam claims</h3><ol><li>Ask what the chart problem is.</li><li>Ask for screenshot/recording proof.</li><li>Remind them to compare with MT4 and TradingView.</li><li>If a bug is proven, create a PUSH ticket for IT (Midware group for price issues).</li></ol>
<h3>Indicator inaccurate</h3><p>Explain that indicators can give false signals, especially in volatile markets, because they rely on past data. Give some quick education.</p>
<h3>Real vs demo</h3><p>A real account uses real money with real profit and loss; a demo account uses virtual money to practise without risk.</p>`]},
 {t:["Bug aplikasi & tidak bisa login","App bugs & login problems"],b:[`<div class="tw"><table><tr><th>Masalah</th><th>Langkah</th></tr>
<tr><td>Halaman putih kosong</td><td>Restart HP → install ulang aplikasi → kalau masih, tiket PUSH ke IT.</td></tr>
<tr><td>Chart tidak bergerak/tidak muncul</td><td>Cek apakah terjadi di semua perangkat atau hanya customer ini → restart HP → install ulang → tiket PUSH ke IT.</td></tr>
<tr><td>Tidak ada koneksi internet</td><td>Restart HP → install ulang → tiket PUSH ke IT dengan rekaman layar dan hasil cek jaringan.</td></tr>
<tr><td>Tidak bisa login</td><td>Cek sinyal atau VPN yang aktif → pastikan email dan password benar → pakai "Lupa Password".</td></tr></table></div><p>Tiket bug masuk ke 2. R&amp;D: dana-Issues-Response (aplikasi DANA) atau tw-Issues-Response (aplikasi TW).</p>`,`<div class="tw"><table><tr><th>Issue</th><th>Steps</th></tr>
<tr><td>White blank page</td><td>Restart the device → reinstall the app → if it persists, PUSH ticket to IT.</td></tr>
<tr><td>Chart not moving/loading</td><td>Check if it happens on all devices or only this customer → restart → reinstall → PUSH ticket to IT.</td></tr>
<tr><td>No internet connection</td><td>Restart → reinstall → PUSH ticket to IT with a screen recording and network check.</td></tr>
<tr><td>Unable to log in</td><td>Check for an active signal or VPN → confirm email and password → use "Forgot Password".</td></tr></table></div><p>Bug tickets go to 2. R&amp;D: dana-Issues-Response (DANA app) or tw-Issues-Response (TW app).</p>`]}
]},
