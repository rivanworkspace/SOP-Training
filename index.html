{k:"case",t:["Studi kasus","Case studies"],d:["Situasi nyata dari meja CS. Pikirkan dulu langkahmu, lalu buka jawabannya.","Real situations from the CS desk. Think of your steps first, then open the answer."],s:[
 {t:["Deposit QRIS 2 jam belum masuk","QRIS deposit not credited after 2 hours"],b:[`<p class="case">Customer: "Saya sudah transfer Rp500.000 lewat QRIS 2 jam lalu, tapi saldo belum masuk."</p><details class="ans"><summary>Lihat langkah yang benar</summary><ol><li>Minta maaf, lalu minta bukti transfer yang memuat <b>RRN</b>, waktu, nominal, nama pengirim, dan nomor order deposit.</li><li>Cek order di CRM → Deposit Order.</li><li>Laporkan lewat CRM (ikon Report), pilih waktu sedikit sebelum order dibuat, unggah bukti.</li><li>Kalau mendesak atau customer tidak membuat order, eskalasi di grup Lark Deposit Prioritized Handling.</li><li>Kabari customer setelah selesai. Pakai template "Deposit belum masuk".</li></ol></details>`,`<p class="case">Customer: "I paid Rp500,000 by QRIS two hours ago and my balance still isn't updated."</p><details class="ans"><summary>Show the right steps</summary><ol><li>Apologise, then ask for the receipt with the <b>RRN</b>, time, amount, sender name and deposit order number.</li><li>Check the order in CRM → Deposit Order.</li><li>Report it in CRM (Report icon), pick a time just before the order, upload the proof.</li><li>If urgent or there is no order, escalate in the Lark group Deposit Prioritized Handling.</li><li>Update the customer when done. Use the "Deposit not credited" template.</li></ol></details>`]},
 {t:["WD VIP4 tertahan di Automatic Review","VIP4 WD stuck in Automatic Review"],b:[`<p class="case">Customer VIP4 kesal karena WD-nya 1 jam berstatus Automatic Review.</p><details class="ans"><summary>Lihat langkah yang benar</summary><ol><li>Automatic Review lebih dari 30 menit dilaporkan ke Payment: PUSH 0. Pay Support → Expedite withdrawal review.</li><li>Customer VIP4 memang boleh dilaporkan supaya dipercepat.</li><li>Jangan menjanjikan waktu; minta customer menunggu dengan sopan dan kabari perkembangannya.</li></ol></details>`,`<p class="case">A VIP4 customer is upset because the WD has been in Automatic Review for an hour.</p><details class="ans"><summary>Show the right steps</summary><ol><li>Automatic Review over 30 minutes is reported to Payment: PUSH 0. Pay Support → Expedite withdrawal review.</li><li>VIP4 customers may be reported to expedite.</li><li>Don't promise a time; politely ask them to wait and keep them updated.</li></ol></details>`]},
 {t:["Kode 1007 setelah deposit langsung WD","Code 1007 after an immediate withdrawal"],b:[`<p class="case">Customer deposit lalu langsung WD tanpa trading. CRM menampilkan kode 1007.</p><details class="ans"><summary>Lihat langkah yang benar</summary><ol><li>Jangan menyebut WDTT dan jangan bertanya "kenapa tidak trading?".</li><li>Ajukan pertanyaan netral, misalnya alasan melakukan deposit.</li><li>Minta 1–5 bukti deposit dengan nama pengirim, foto KTP, dan nomor WhatsApp.</li><li>Pastikan metode WD sama dengan metode deposit, lalu buat tiket PUSH (WDTT).</li></ol></details>`,`<p class="case">The customer deposited and withdrew right away without trading. CRM shows code 1007.</p><details class="ans"><summary>Show the right steps</summary><ol><li>Don't mention WDTT or ask "why didn't you trade?".</li><li>Ask neutral questions, such as the reason for depositing.</li><li>Ask for 1–5 deposit receipts with the sender name, an ID photo and a WhatsApp number.</li><li>Make sure the WD method matches the deposit method, then create a PUSH ticket (WDTT).</li></ol></details>`]},
 {t:["Dua akun: lama VIP2, baru sudah deposit","Two accounts: old VIP2, new one funded"],b:[`<p class="case">Customer punya akun lama VIP2 dan akun baru yang sudah deposit $20. Ia ingin memakai akun baru.</p><details class="ans"><summary>Lihat langkah yang benar</summary><ol><li>Tanyakan alasan membuat akun baru dan cek login terakhir akun lama.</li><li>Jelaskan keuntungan VIP2+ di akun lama.</li><li>Kalau tetap ingin pindah: ajukan transfer saldo (minimal $5, dari akun belum terverifikasi ke terverifikasi, identitas sama) atau hapus akun lama.</li><li>Dokumen dikirim dari akun BARU: foto KTP, bukti deposit, email. Selama 2×24 jam tidak boleh deposit/trading.</li></ol></details>`,`<p class="case">The customer has an old VIP2 account and a new one with a $20 deposit, and wants to use the new one.</p><details class="ans"><summary>Show the right steps</summary><ol><li>Ask why they made a new account and check the old account's last login.</li><li>Explain the VIP2+ benefits on the old account.</li><li>If they still want to switch: request a balance transfer (min $5, unverified to verified, same identity) or delete the old account.</li><li>Documents come from the NEW account: ID photo, deposit proof, email. No deposits/trades for 2×24 hours.</li></ol></details>`]},
 {t:["Hapus akun VIP1 dengan saldo $2","Delete a VIP1 account with $2"],b:[`<p class="case">Customer VIP1 ingin menghapus akun yang masih bersaldo $2.</p><details class="ans"><summary>Lihat langkah yang benar</summary><ol><li>Sampaikan bahwa sisa saldo akan hangus.</li><li>Saldo di bawah $3: lakukan konfirmasi dua kali, dan catat jawabannya.</li><li>Di CRM: cek VIP dan saldo → User Logout → isi alasan dan pernyataan saldo hangus → lampirkan KTP sebagai gambar → Submit.</li></ol></details>`,`<p class="case">A VIP1 customer wants to delete an account that still holds $2.</p><details class="ans"><summary>Show the right steps</summary><ol><li>Tell them the remaining balance will be forfeited.</li><li>Balance under $3: double confirm and write down their answer.</li><li>In CRM: check VIP and balance → User Logout → enter the reason and forfeit statement → attach the ID as an image → Submit.</li></ol></details>`]},
 {t:["Saldo minus terpotong deposit (NBP)","Negative balance deducted from a deposit (NBP)"],b:[`<p class="case">Saldo customer -$8,74, lalu ia deposit $6 dan saldonya tetap berkurang.</p><details class="ans"><summary>Lihat langkah yang benar</summary><ol><li>Cek di CRM: nomor, waktu, dan jumlah deposit serta NBP.</li><li>Tulis detail dengan format NBP (modul Akun), tanpa PUSH dan tanpa screenshot saldo.</li><li>Lampirkan foto deposit order, close order, dan liquidation order.</li><li>Jelaskan ke customer dengan template "Penjelasan saldo negatif".</li></ol></details>`,`<p class="case">The balance was -$8.74; the customer deposited $6 and it was used up.</p><details class="ans"><summary>Show the right steps</summary><ol><li>Check in CRM: the deposit and NBP numbers, times and amounts.</li><li>Write the details in the NBP format (Account module), with no PUSH and no balance screenshot.</li><li>Attach the deposit order, close order and liquidation order photos.</li><li>Explain to the customer with the "Explaining negative balance" template.</li></ol></details>`]},
 {t:["Customer menuduh manipulasi harga","Customer claims price manipulation"],b:[`<p class="case">Customer: "SL saya kena padahal harga belum sampai. Kalian manipulasi!"</p><details class="ans"><summary>Lihat langkah yang benar</summary><ol><li>Minta maaf dan tetap tenang; cek waktu penutupan posisi.</li><li>Jelaskan harga Bid/Ask dan spread floating: posisi Buy ditutup di harga Bid.</li><li>Kalau saat itu pasar bergerak cepat, jelaskan slippage.</li><li>Minta bukti dan sarankan membandingkan dengan TradingView. Kalau terbukti bug, tiket PUSH 4.Midware-Issues.</li><li>Kupon kompensasi hanya dengan persetujuan Team Leader.</li></ol></details>`,`<p class="case">Customer: "My SL was hit before the price got there. You're manipulating prices!"</p><details class="ans"><summary>Show the right steps</summary><ol><li>Apologise and stay calm; check the close time.</li><li>Explain Bid/Ask prices and floating spreads: a Buy closes at the Bid.</li><li>If the market moved fast, explain slippage.</li><li>Ask for proof and suggest comparing with TradingView. If a bug is proven, a PUSH ticket to 4.Midware-Issues.</li><li>Compensation coupons only with the Team Leader's approval.</li></ol></details>`]},
 {t:["KYC gagal: Name check failed","KYC failed: Name check failed"],b:[`<p class="case">Status di CRM: "Name check failed, please re-enter".</p><details class="ans"><summary>Lihat langkah yang benar</summary><ol><li>Ingatkan bahwa nama di aplikasi, KTP, dan rekening harus sama.</li><li>Cek apakah data sudah dipakai di akun lain.</li><li>Minta unggah ulang KTP depan-belakang yang jelas (bukan screenshot/scan) sekali saja.</li><li>Kalau semua benar tapi tetap gagal, eskalasi ke Team Leader.</li></ol></details>`,`<p class="case">CRM shows: "Name check failed, please re-enter".</p><details class="ans"><summary>Show the right steps</summary><ol><li>Remind them the name in the app, ID and bank account must match.</li><li>Check whether the data is used on another account.</li><li>Ask for one clear upload of the ID front and back (no screenshot/scan).</li><li>If everything is right but it still fails, escalate to the Team Leader.</li></ol></details>`]},
 {t:["Tidak bisa terima OTP, minta ganti HP","Can't receive OTP, wants a new phone number"],b:[`<p class="case">Customer sudah ganti nomor HP dan tidak bisa menerima OTP.</p><details class="ans"><summary>Lihat langkah yang benar</summary><ol><li>Tanyakan alasan perubahan lebih dulu.</li><li>Kumpulkan: SID, nomor lama dan baru, foto KTP, minimal 3 bukti deposit (atau selfie dengan KTP), nomor WhatsApp aktif.</li><li>Cek di CRM → User List bahwa nomor baru belum terdaftar dan bisa menerima OTP.</li><li>Buat tiket PUSH 5.CS / 0.ID-CSTeam-Support.</li></ol></details>`,`<p class="case">The customer changed phone numbers and can't receive OTP.</p><details class="ans"><summary>Show the right steps</summary><ol><li>Ask for the reason first.</li><li>Collect: SID, old and new number, ID photo, at least 3 deposit receipts (or a selfie with ID), active WhatsApp number.</li><li>Check CRM → User List that the new number isn't registered and can receive OTP.</li><li>Create a PUSH ticket 5.CS / 0.ID-CSTeam-Support.</li></ol></details>`]}
]},
{k:"tpl",t:["Template balasan","Reply templates"],d:["Kalimat siap pakai untuk customer. Klik Salin, lalu sesuaikan nama dan detailnya.","Ready-to-use customer messages. Click Copy, then adjust the name and details."],s:[
 {t:["Deposit belum masuk: minta bukti", "Deposit not credited: ask for proof"],b:[`<div class="tpl"><pre>Halo Bapak/Ibu, mohon maaf atas ketidaknyamanannya. Agar deposit bisa segera kami bantu cek, mohon kirimkan:
1. Bukti transfer yang menunjukkan transaksi berhasil (terlihat tanggal, jam, nominal, nama pengirim, dan No. Ref / RRN untuk QRIS)
2. Nomor order deposit dari aplikasi
Terima kasih.</pre></div>`,`<div class="tpl"><pre>Hello, we apologise for the inconvenience. So we can check your deposit right away, please send:
1. The receipt showing a successful transaction (date, time, amount, sender name, and Ref No. / RRN for QRIS)
2. The deposit order number from the app
Thank you.</pre></div>`]},
 {t:["Deposit sudah dilaporkan", "Deposit reported"],b:[`<div class="tpl"><pre>Terima kasih atas datanya, Bapak/Ibu. Kendala deposit sudah kami teruskan ke tim terkait dan sedang diproses. Kami akan segera mengabari begitu dana sudah masuk ke akun Anda.</pre></div>`,`<div class="tpl"><pre>Thank you for the details. Your deposit issue has been passed to the team concerned and is being processed. We will update you as soon as the funds reach your account.</pre></div>`]},
 {t:["WD sedang ditinjau", "WD under review"],b:[`<div class="tpl"><pre>Halo Bapak/Ibu, permintaan penarikan Anda sedang dalam proses peninjauan. Boleh kami minta nomor WhatsApp aktif agar tim kami dapat menghubungi Anda untuk proses lebih lanjut? Terima kasih atas kesabarannya.</pre></div>`,`<div class="tpl"><pre>Hello, your withdrawal request is under review. Could you share an active WhatsApp number so our team can contact you to continue the process? Thank you for your patience.</pre></div>`]},
 {t:["WD sukses tapi dana belum diterima", "WD successful but not received"],b:[`<div class="tpl"><pre>Halo Bapak/Ibu, di sistem kami penarikan sudah berhasil diproses. Agar bisa kami telusuri bersama bank, mohon kirimkan rekaman layar riwayat transaksi rekening dari tanggal penarikan sampai hari ini (nomor rekening terlihat), atau file PDF mutasi yang memuat nama, nomor rekening, dan tanggal penarikan. Terima kasih.</pre></div>`,`<div class="tpl"><pre>Hello, our system shows the withdrawal was processed successfully. So we can trace it with the bank, please send a screen recording of your account history from the withdrawal date until today (account number visible), or a PDF statement showing your name, account number and the withdrawal date. Thank you.</pre></div>`]},
 {t:["Verifikasi gagal: minta foto ulang", "Verification failed: ask for new photos"],b:[`<div class="tpl"><pre>Halo Bapak/Ibu, verifikasi belum berhasil karena foto identitas belum terbaca dengan jelas. Mohon unggah ulang foto KTP sisi depan dan belakang (bukan screenshot atau hasil scan), pastikan nama lengkap, NIK, tanggal lahir, dan foto terlihat jelas tanpa pantulan cahaya. Pastikan juga nama di aplikasi sama dengan nama di KTP dan rekening.</pre></div>`,`<div class="tpl"><pre>Hello, the verification didn't go through because the ID photo wasn't clear enough. Please upload the front and back of your ID card again (not a screenshot or a scan), making sure the full name, ID number, date of birth and photo are clear with no glare. Also make sure the name in the app matches your ID and bank account.</pre></div>`]},
 {t:["Konfirmasi hapus akun", "Confirm account deletion"],b:[`<div class="tpl"><pre>Baik Bapak/Ibu, sebelum kami proses, kami informasikan bahwa sisa saldo di akun ini akan hangus setelah akun dihapus dan tidak dapat dikembalikan. Apakah Bapak/Ibu setuju untuk melanjutkan penghapusan akun?</pre></div>`,`<div class="tpl"><pre>Before we proceed, please note that any remaining balance in this account will be forfeited once the account is deleted and cannot be recovered. Do you agree to continue with the deletion?</pre></div>`]},
 {t:["Penjelasan slippage", "Explaining slippage"],b:[`<div class="tpl"><pre>Mohon maaf atas ketidaknyamanannya, Bapak/Ibu. Slippage adalah selisih antara harga yang diharapkan dengan harga yang benar-benar tereksekusi. Ini terjadi saat pasar bergerak sangat cepat, misalnya saat rilis berita, sehingga order tereksekusi di harga terbaik yang tersedia saat itu. Untuk mengurangi risikonya, Bapak/Ibu bisa memakai limit order atau menghindari trading saat volatilitas tinggi.</pre></div>`,`<div class="tpl"><pre>We apologise for the inconvenience. Slippage is the gap between the expected price and the price actually executed. It happens when the market moves very fast, for example during news releases, so the order fills at the best price available at that moment. To reduce the risk, you can use limit orders or avoid trading in high volatility.</pre></div>`]},
 {t:["Penjelasan saldo negatif (NBP)", "Explaining negative balance (NBP)"],b:[`<div class="tpl"><pre>Halo Bapak/Ibu, sebelumnya saldo akun Anda sempat minus akibat pergerakan pasar, dan sistem Perlindungan Saldo Negatif memakai deposit berikutnya untuk menutupinya. Kami sudah meneruskan kasus ini untuk dicek ulang dan akan mengabari Anda hasilnya.</pre></div>`,`<div class="tpl"><pre>Hello, your account balance went negative because of market movement, and the Negative Balance Protection system used your next deposit to cover it. We have passed this case on for review and will update you on the result.</pre></div>`]},
 {t:["Cara ganti rekening bank", "How to change bank account"],b:[`<div class="tpl"><pre>Bapak/Ibu bisa mengganti rekening sendiri lewat aplikasi: buka menu Akun → Pengaturan → Verifikasi Identitas → Ubah rekening bank. Pastikan nama pemilik rekening sama dengan nama di KTP. Jika ingin pindah dari rekening bank ke e-wallet, silakan hubungi kami agar kami bantu prosesnya.</pre></div>`,`<div class="tpl"><pre>You can change the account yourself in the app: Account → Settings → Identity Verification → Change bank account. The account holder's name must match your ID. To switch from a bank account to an e-wallet, please contact us and we will help.</pre></div>`]}
]},
{k:"gloss",t:["Glosarium","Glossary"],d:["Istilah yang sering muncul di SOP, CRM, dan PUSH.","Terms that come up often in the SOP, CRM and PUSH."],s:[
 {t:["Daftar istilah","Terms"],b:[`<div class="tw"><table><tr><th>Istilah</th><th>Arti</th></tr><tr><td><b>SID</b></td><td>ID customer di CRM. BtcDana diawali 100…, TradeWill 200….</td></tr><tr><td><b>BD / TW</b></td><td>BtcDana (project DANA) dan TradeWill (project TW).</td></tr><tr><td><b>CRM</b></td><td>Sistem internal untuk melihat data customer, order, dan verifikasi.</td></tr><tr><td><b>PUSH</b></td><td>Sistem tiket untuk eskalasi masalah ke tim terkait.</td></tr><tr><td><b>TC / AM</b></td><td>Trading Consultant (Sales) dan Account Manager (CS) yang ditugaskan ke customer.</td></tr><tr><td><b>No. Ref / RRN</b></td><td>Nomor referensi transaksi. No. Ref wajib untuk transfer bank, RRN wajib untuk QRIS.</td></tr><tr><td><b>VA</b></td><td>Virtual Account, nomor tujuan transfer deposit yang dibuat aplikasi.</td></tr><tr><td><b>Mutasi / e-statement</b></td><td>Riwayat transaksi rekening dari bank (PDF atau rekaman layar).</td></tr><tr><td><b>WDTT / WDWT</b></td><td>Withdraw tanpa aktivitas trading yang wajar; ditandai sistem risk control (kode 1007).</td></tr><tr><td><b>NBP</b></td><td>Negative Balance Protection: saldo minus ditutup sistem, bisa memotong deposit berikutnya (kode 1012).</td></tr><tr><td><b>KYC / Liveness</b></td><td>Verifikasi identitas customer; liveness = verifikasi wajah langsung.</td></tr><tr><td><b>MT5</b></td><td>Platform trading MetaTrader 5; verifikasinya terhubung dengan aplikasi dan website.</td></tr><tr><td><b>VIP0–VIP4</b></td><td>Level customer. VIP4 mendapat bebas swap dan diskon komisi; WD-nya boleh dipercepat.</td></tr><tr><td><b>Margin level</b></td><td>Perbandingan equity terhadap margin terpakai. Di bawah 10% terjadi Stop Out.</td></tr><tr><td><b>Stop Out (SO)</b></td><td>Posisi ditutup otomatis karena margin tidak cukup.</td></tr><tr><td><b>Liquidation order</b></td><td>Catatan penutupan posisi oleh sistem (dilampirkan untuk kasus NBP).</td></tr><tr><td><b>Spread</b></td><td>Selisih harga Bid (jual) dan Ask (beli); kita memakai spread floating.</td></tr><tr><td><b>Swap</b></td><td>Biaya menginap posisi melewati pergantian hari.</td></tr><tr><td><b>Slippage</b></td><td>Selisih harga yang diharapkan dengan harga eksekusi saat pasar bergerak cepat.</td></tr><tr><td><b>TP / SL</b></td><td>Take Profit dan Stop Loss; jarak minimum 50 pips.</td></tr><tr><td><b>BDC</b></td><td>Event/promosi di aplikasi; masalahnya dilaporkan ke 3.BDC-Issues-Response.</td></tr></table></div>`,`<div class="tw"><table><tr><th>Term</th><th>Meaning</th></tr><tr><td><b>SID</b></td><td>Customer ID in CRM. BtcDana starts with 100…, TradeWill with 200….</td></tr><tr><td><b>BD / TW</b></td><td>BtcDana (DANA project) and TradeWill (TW project).</td></tr><tr><td><b>CRM</b></td><td>Internal system for customer data, orders and verification.</td></tr><tr><td><b>PUSH</b></td><td>Ticket system for escalating issues to the right team.</td></tr><tr><td><b>TC / AM</b></td><td>The customer's assigned Trading Consultant (Sales) and Account Manager (CS).</td></tr><tr><td><b>No. Ref / RRN</b></td><td>Transaction reference number. Ref No. for bank transfers, RRN for QRIS.</td></tr><tr><td><b>VA</b></td><td>Virtual Account, the deposit transfer number generated by the app.</td></tr><tr><td><b>Mutasi / e-statement</b></td><td>Bank account transaction history (PDF or screen recording).</td></tr><tr><td><b>WDTT / WDWT</b></td><td>Withdrawal without proper trading activity; flagged by risk control (code 1007).</td></tr><tr><td><b>NBP</b></td><td>Negative Balance Protection: a negative balance is covered by the system and can deduct the next deposit (code 1012).</td></tr><tr><td><b>KYC / Liveness</b></td><td>Customer identity verification; liveness = live face check.</td></tr><tr><td><b>MT5</b></td><td>MetaTrader 5 trading platform; its verification is linked to the app and website.</td></tr><tr><td><b>VIP0–VIP4</b></td><td>Customer levels. VIP4 gets swap-free and a commission discount; its WDs may be expedited.</td></tr><tr><td><b>Margin level</b></td><td>Equity versus used margin. Below 10% a Stop Out happens.</td></tr><tr><td><b>Stop Out (SO)</b></td><td>Positions closed automatically because margin is too low.</td></tr><tr><td><b>Liquidation order</b></td><td>Record of positions closed by the system (attached for NBP cases).</td></tr><tr><td><b>Spread</b></td><td>Gap between Bid (sell) and Ask (buy); we use floating spreads.</td></tr><tr><td><b>Swap</b></td><td>Overnight fee for holding a position past the daily rollover.</td></tr><tr><td><b>Slippage</b></td><td>Gap between expected and executed price in fast markets.</td></tr><tr><td><b>TP / SL</b></td><td>Take Profit and Stop Loss; minimum distance 50 pips.</td></tr><tr><td><b>BDC</b></td><td>An in-app event; issues go to 3.BDC-Issues-Response.</td></tr></table></div>`]}
]},

 let h=`<div class="mhead"><span class="eyebrow">"${esc(q)}"</span><h1>${hits.length} ${T(UI.results)}</h1></div>`;

 h+=hits.map(([m,s])=>m==="code"?`<details class="sec" open><summary>${chev}<h2>${T(UI.codesT)}: ${s.c}</h2><span class="tag">WD</span></summary><div class="body"><p><b>${T(UI.why)}:</b> ${mark(esc(T(s.why)),q)}</p><p><b>${T(UI.act)}:</b> ${mark(esc(T(s.act)),q)}</p><p class="say">${mark(esc(s.msg[0]),q)}</p></div></details>`:secHTML(s,true,q).replace("</summary>",`<span class="tag">${esc(T(m.t))}</span></summary>`)).join("");

function codesTool(){const c=CODES.find(x=>x.c===codeSel)||CODES[0],cats=[...new Set(CODES.map(x=>x.cat[0]))];
 return `<section class="tool"><h2>${T(UI.codesT)}</h2><p>${T(UI.codesP)}</p>

 <div class="tabs" role="tablist">${gs.map((g,i)=>`<button role="tab" data-dg="${i}" aria-selected="${i===docG}">${esc(T(g))}<span>${DOCS.filter(x=>x.g[0]===groups[i]).length}</span></button>`).join("")}</div>
